<script data-purpose="qr-generator">
    document.addEventListener("DOMContentLoaded", function () {
      const canvas = document.getElementById("qrCanvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      const size = 180;
      canvas.width = size;
      canvas.height = size;

      // QR Code grid pattern reproduction matching the visual structure
      // 21x21 matrix standard for version 1 QR
      const modules = 21;
      const cellSize = size / modules;

      // Initialize empty grid (0: white, 1: black)
      const grid = Array.from({ length: modules }, () => Array(modules).fill(0));

      // Finder patterns builder function
      function drawFinder(row, col) {
        for (let r = 0; r < 7; r++) {
          for (let c = 0; c < 7; c++) {
            if (
              r === 0 || r === 6 || c === 0 || c === 6 ||
              (r >= 2 && r <= 4 && c >= 2 && c <= 4)
            ) {
              grid[row + r][col + c] = 1;
            }
          }
        }
      }

      // Draw standard three corners finder patterns
      drawFinder(0, 0);                 // Top-left
      drawFinder(0, modules - 7);        // Top-right
      drawFinder(modules - 7, 0);        // Bottom-left

      // Timing patterns & alignment specs
      for (let i = 8; i < modules - 8; i += 2) {
        grid[6][i] = 1;
        grid[i][6] = 1;
      }

      // High density pseudo-random deterministic filling for the visual pattern
      const dataSeeds = [
        [0, 8], [1, 9], [2, 11], [3, 9], [4, 10], [5, 8],
        [7, 1], [7, 3], [7, 5], [7, 8], [7, 10], [7, 12],
        [8, 2], [8, 4], [8, 6], [8, 8], [8, 10], [8, 12], [8, 14], [8, 16], [8, 18],
        [9, 1], [9, 3], [9, 5], [9, 7], [9, 9], [9, 11], [9, 13], [9, 15], [9, 17], [9, 19],
        [10, 8], [10, 10], [10, 12], [10, 14], [10, 16], [10, 18],
        [11, 3], [11, 7], [11, 9], [11, 11], [11, 13], [11, 15], [11, 17],
        [12, 8], [12, 10], [12, 12], [12, 14], [12, 16], [12, 18],
        [13, 1], [13, 3], [13, 5], [13, 7], [13, 9], [13, 11], [13, 15], [13, 19],
        [14, 8], [14, 10], [14, 12], [14, 14], [14, 18],
        [15, 9], [15, 11], [15, 13], [15, 17],
        [16, 8], [16, 12], [16, 14], [16, 16],
        [17, 9], [17, 11], [17, 13], [17, 15], [17, 17], [17, 19],
        [18, 8], [18, 10], [18, 12], [18, 14], [18, 16], [18, 18],
        [19, 7], [19, 9], [19, 13], [19, 15], [19, 17],
        [20, 8], [20, 10], [20, 12], [20, 14], [20, 16], [20, 18]
      ];

      dataSeeds.forEach(([r, c]) => {
        if (r < modules && c < modules) grid[r][c] = 1;
      });

      // Clear Canvas
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, size, size);

      // Render crisp sharp pixels
      ctx.fillStyle = "#111111";
      for (let r = 0; r < modules; r++) {
        for (let c = 0; c < modules; c++) {
          if (grid[r][c] === 1) {
            ctx.fillRect(
              Math.round(c * cellSize),
              Math.round(r * cellSize),
              Math.ceil(cellSize),
              Math.ceil(cellSize)
            );
          }
        }
      }
    });
  </script>
<!-- END: QR Code Generation Script -->
