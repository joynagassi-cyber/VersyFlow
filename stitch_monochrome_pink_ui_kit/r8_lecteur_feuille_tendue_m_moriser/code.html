<!DOCTYPE html>

<html lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>R8 — Lecteur — feuille étendue (mémoriser)</title>
<!-- Tailwind CSS CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Inter & Newsreader / Playfair for elegant Biblical serif typography -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&amp;family=Inter:wght@400;500;600;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&amp;display=swap" rel="stylesheet"/>
<style data-purpose="custom-typography">
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .font-serif-bible {
      font-family: 'Newsreader', Georgia, serif;
    }
  </style>
<style data-purpose="shadows-and-accents">
    .cta-shadow {
      box-shadow: 0 10px 25px -4px rgba(219, 39, 119, 0.4), 0 4px 6px -2px rgba(219, 39, 119, 0.2);
    }
    .sheet-shadow {
      box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.18);
    }
  </style>
</head>
<body class="bg-[#71717a] flex justify-center items-center min-h-screen p-0 sm:p-4 select-none">
<!-- BEGIN: MobileDeviceFrame -->
<div class="relative w-full max-w-[412px] h-[890px] bg-white overflow-hidden shadow-2xl sm:rounded-[48px] flex flex-col justify-between border-[6px] border-neutral-900" data-purpose="mobile-container">
<!-- BEGIN: BackgroundReaderView (Dimmed Scripture Background) -->
<div class="absolute inset-0 bg-[#e4e4e7] pointer-events-none select-none" data-purpose="underlying-biblical-reader">
<!-- iOS Status Bar Simulation -->
<div class="px-8 pt-3 flex justify-between items-center text-sm font-semibold text-neutral-800">
<span>9:41</span>
<div class="flex items-center space-x-1.5">
<span class="text-xs font-bold">5G</span>
<div class="flex items-end space-x-0.5 h-3">
<span class="w-1 h-1.5 bg-neutral-800 rounded-2xs"></span>
<span class="w-1 h-2 bg-neutral-800 rounded-2xs"></span>
<span class="w-1 h-2.5 bg-neutral-800 rounded-2xs"></span>
<span class="w-1 h-3 bg-neutral-800 rounded-2xs"></span>
</div>
</div>
</div>
<!-- Top Reader App Bar -->
<header class="px-5 pt-4 pb-2 flex justify-between items-center text-neutral-900">
<button class="flex items-center space-x-1.5 font-bold text-xl tracking-tight">
<span>Psaumes 23</span>
<svg class="w-4 h-4 mt-0.5 text-neutral-700" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<div class="flex items-center space-x-3">
<!-- Search Icon -->
<div class="p-1.5 text-neutral-800">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewbox="0 0 24 24">
<path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- More / Options Icon -->
<div class="p-1.5 text-neutral-800">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewbox="0 0 24 24">
<path d="M5 12h.01M12 12h.01M19 12h.01M6 12a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Version Badge -->
<div class="flex items-center space-x-1 bg-neutral-300/80 px-2.5 py-1 rounded-full text-xs font-bold text-neutral-800">
<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.657-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.657-9 3-9" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>LSG</span>
</div>
</div>
</header>
<!-- Dimmed Watermark Chapter Background -->
<div class="relative px-6 pt-2">
<span class="text-[120px] font-serif-bible font-bold text-neutral-400/40 select-none leading-none absolute left-5 top-0">
          23
        </span>
<div class="pt-8 pl-36">
<h2 class="text-2xl font-serif-bible text-neutral-800 font-semibold tracking-wide">
            Psaume de David.
          </h2>
</div>
</div>
<!-- Backdrop Overlay -->
<div class="absolute inset-0 bg-neutral-900/35 backdrop-blur-[1px]"></div>
</div>
<!-- END: BackgroundReaderView -->
<!-- BEGIN: MemorizationBottomSheet -->
<div class="relative mt-auto w-full bg-white rounded-t-[34px] sheet-shadow z-10 pt-3 pb-8 px-6 flex flex-col justify-between" data-purpose="memorize-modal-sheet">
<!-- Pull Bar Indicator -->
<div class="w-full flex justify-center pb-3">
<div class="w-12 h-1 bg-neutral-900 rounded-full"></div>
</div>
<!-- Content Area -->
<div class="space-y-4">
<!-- Header: Subtitle, Title & Badge -->
<div>
<span class="text-[11px] font-bold tracking-wider text-[#d81b60] uppercase block mb-0.5">
            Mémoriser ce passage
          </span>
<div class="flex items-center justify-between">
<h1 class="text-[28px] font-serif-bible font-bold tracking-tight text-neutral-950">
              Psaumes 23:1-3
            </h1>
<span class="bg-[#fce7f3] text-[#be185d] text-xs font-semibold px-2.5 py-0.5 rounded-full">
              Nouveau
            </span>
</div>
</div>
<!-- Verses Boundary Range Pickers -->
<!-- BEGIN: RangeSelectors -->
<div class="grid grid-cols-2 gap-3 pt-1">
<!-- Start Verse Card -->
<div class="border border-neutral-200 rounded-2xl p-3 bg-white flex flex-col justify-between shadow-xs">
<span class="text-xs text-neutral-500 font-medium">Début</span>
<div class="flex items-baseline justify-between mt-1">
<span class="text-xl font-bold tracking-tight text-neutral-900">23:1</span>
<div class="flex items-center space-x-1.5 text-neutral-500 text-xs">
<button aria-label="Diminuer début" class="hover:text-neutral-900 transition-colors p-0.5 font-medium leading-none">-</button>
<button aria-label="Augmenter début" class="hover:text-neutral-900 transition-colors p-0.5 font-medium leading-none">+</button>
</div>
</div>
</div>
<!-- End Verse Card -->
<div class="border border-neutral-200 rounded-2xl p-3 bg-white flex flex-col justify-between shadow-xs">
<span class="text-xs text-neutral-500 font-medium">Fin</span>
<div class="flex items-baseline justify-between mt-1">
<span class="text-xl font-bold tracking-tight text-neutral-900">23:3</span>
<div class="flex items-center space-x-1.5 text-neutral-500 text-xs">
<button aria-label="Diminuer fin" class="hover:text-neutral-900 transition-colors p-0.5 font-medium leading-none">-</button>
<button aria-label="Augmenter fin" class="hover:text-neutral-900 transition-colors p-0.5 font-medium leading-none">+</button>
</div>
</div>
</div>
</div>
<!-- END: RangeSelectors -->
<!-- Informative Badges -->
<!-- BEGIN: InfoBadges -->
<div class="flex flex-wrap items-center gap-2 pt-0.5">
<span class="inline-flex items-center bg-[#dcfce7] text-[#15803d] text-xs font-medium px-3 py-1 rounded-full">
            3 flashcards
          </span>
<span class="inline-flex items-center bg-[#dcfce7] text-[#15803d] text-xs font-medium px-3 py-1 rounded-full">
            3 champs d’écriture
          </span>
<span class="inline-flex items-center bg-[#fce7f3] text-[#be185d] text-xs font-medium px-2.5 py-1 rounded-full">
            ≈ 9 min
          </span>
</div>
<!-- END: InfoBadges -->
<!-- Mode Switcher (Pill Segmented Control) -->
<!-- BEGIN: ModeSegmentedControl -->
<div class="p-1 bg-[#f3edf2] rounded-2xl flex items-center" data-purpose="segmented-tabs">
<button class="flex-1 py-2 rounded-xl text-center text-sm font-semibold text-neutral-900 bg-white shadow-sm border border-neutral-200/40 transition-all">
            Parcours guidé
          </button>
<button class="flex-1 py-2 rounded-xl text-center text-sm font-medium text-neutral-700 hover:text-neutral-950 transition-colors">
            Mode libre
          </button>
</div>
<!-- END: ModeSegmentedControl -->
<!-- Explanation Guide -->
<p class="text-xs text-neutral-600 leading-relaxed font-normal pt-0.5">
          Révélation → Masquage → Flashcard → Écriture. L’écriture se débloque à la fin du parcours.
        </p>
<!-- Main Action CTA Button -->
<div class="pt-2">
<button class="w-full bg-[#d81b60] hover:bg-[#c2185b] active:scale-[0.99] text-white font-semibold py-3.5 px-6 rounded-full text-base tracking-wide cta-shadow transition-all duration-150 text-center block">
            Commencer le parcours
          </button>
</div>
<!-- Section: Autres Actions -->
<!-- BEGIN: OtherActions -->
<div class="pt-2">
<span class="text-[11px] font-bold tracking-wider text-[#9d174d] uppercase block mb-2.5">
            Autres actions
          </span>
<div class="grid grid-cols-4 gap-2.5">
<!-- Action 1: Sauvegarder -->
<button class="bg-[#f3f4f6] hover:bg-[#e5e7eb] text-neutral-900 rounded-2xl p-2.5 flex flex-col items-center justify-center space-y-1.5 transition-colors aspect-square">
<svg class="w-5 h-5 text-neutral-800" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[11px] font-medium leading-none text-neutral-800">Sauvegarder</span>
</button>
<!-- Action 2: Note -->
<button class="bg-[#f3f4f6] hover:bg-[#e5e7eb] text-neutral-900 rounded-2xl p-2.5 flex flex-col items-center justify-center space-y-1.5 transition-colors aspect-square">
<svg class="w-5 h-5 text-neutral-800" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[11px] font-medium leading-none text-neutral-800">Note</span>
</button>
<!-- Action 3: Copier -->
<button class="bg-[#f3f4f6] hover:bg-[#e5e7eb] text-neutral-900 rounded-2xl p-2.5 flex flex-col items-center justify-center space-y-1.5 transition-colors aspect-square">
<svg class="w-5 h-5 text-neutral-800" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[11px] font-medium leading-none text-neutral-800">Copier</span>
</button>
<!-- Action 4: Partager -->
<button class="bg-[#f3f4f6] hover:bg-[#e5e7eb] text-neutral-900 rounded-2xl p-2.5 flex flex-col items-center justify-center space-y-1.5 transition-colors aspect-square">
<svg class="w-5 h-5 text-neutral-800" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[11px] font-medium leading-none text-neutral-800">Partager</span>
</button>
</div>
</div>
<!-- END: Autres Actions -->
</div>
<!-- iOS Home Indicator bar -->
<div class="w-full flex justify-center pt-3 pb-1">
<div class="w-32 h-1 bg-neutral-300 rounded-full"></div>
</div>
</div>
<!-- END: MemorizationBottomSheet -->
</div>
<!-- END: MobileDeviceFrame -->
</body></html>
