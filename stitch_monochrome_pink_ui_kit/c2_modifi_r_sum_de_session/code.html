<!DOCTYPE html>

<html lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Résumé de session</title>
<!-- Google Fonts: Inter & Newsreader / Playfair for serif titles -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,600;0,8..60,700;0,8..60,800;1,8..60,600&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS v3 CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              magenta: '#c91677',
              magentaDark: '#b21066',
              magentaLight: '#fdf2f8',
              surface: '#f9f9fb',
              subtleBorder: '#f0eef2'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            serif: ['"Source Serif 4"', 'Georgia', 'serif']
          },
          boxShadow: {
            'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
            'card': '0 2px 12px 0 rgba(0, 0, 0, 0.03)'
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Styling for Circular Progress and Fine Details -->
<style data-purpose="component-styles">
    /* Progress Ring SVG rotation to start from the top */
    .progress-ring-circle {
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
      stroke-linecap: round;
    }
    
    /* Device wrapper styling for faithful mobile display */
    body {
      background-color: #f7f7f9;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
<!-- END: Custom Styling for Circular Progress and Fine Details -->
</head>
<body class="flex justify-center items-center min-h-screen p-0 sm:py-6 bg-neutral-100">
<!-- BEGIN: Mobile Device Container -->
<main class="w-full max-w-[390px] min-h-[844px] bg-[#fbfbfe] flex flex-col justify-between px-5 pt-3 pb-8 shadow-2xl relative overflow-hidden text-neutral-900 rounded-none sm:rounded-[44px]">
<!-- BEGIN: iOS Status Bar -->
<header class="w-full flex justify-between items-center px-4 pt-1 pb-2 font-medium text-xs tracking-tight" data-purpose="ios-status-bar">
<!-- Time -->
<span class="text-sm font-semibold tracking-tight text-neutral-900 pl-1">9:41</span>
<!-- Icons: Signal, 5G, Battery -->
<div class="flex items-center gap-1.5 pr-1">
<span class="text-xs font-semibold text-neutral-900 tracking-tighter mr-0.5">5G</span>
<!-- Cellular bars -->
<div class="flex items-end gap-[2px] h-3">
<span class="w-[3px] h-1.5 bg-neutral-900 rounded-[0.5px]"></span>
<span class="w-[3px] h-2 bg-neutral-900 rounded-[0.5px]"></span>
<span class="w-[3px] h-2.5 bg-neutral-900 rounded-[0.5px]"></span>
<span class="w-[3px] h-3 bg-neutral-900 rounded-[0.5px]"></span>
</div>
</div>
</header>
<!-- END: iOS Status Bar -->
<!-- BEGIN: Session Success Header -->
<section class="flex flex-col items-center mt-3 text-center" data-purpose="session-header">
<!-- Magenta Checkmark Circle -->
<div class="w-[72px] h-[72px] rounded-full bg-[#c91677] flex items-center justify-center shadow-md mb-4" data-purpose="success-icon">
<svg class="w-9 h-9 text-white stroke-[3.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Main Title -->
<h1 class="font-serif text-[27px] font-bold tracking-tight text-neutral-900 leading-tight">
        Passage mémorisé
      </h1>
<!-- Subtitle -->
<p class="text-[13.5px] font-medium text-neutral-600 mt-1">
        Psaumes 23:1-3 · par Léa
      </p>
</section>
<!-- END: Session Success Header -->
<!-- BEGIN: Metrics Overview Card -->
<section class="bg-white rounded-2xl p-4 mt-4 shadow-sm border border-neutral-100/80 flex items-center justify-around" data-purpose="metrics-summary">
<!-- Metric 1: Flashcards Ring -->
<div class="flex flex-col items-center">
<div class="relative w-[68px] h-[68px] flex items-center justify-center">
<svg class="w-full h-full" viewbox="0 0 68 68">
<!-- Background Track -->
<circle cx="34" cy="34" fill="none" r="29" stroke="#fce7f3" stroke-width="4.5"></circle>
<!-- Full Complete Magenta Ring -->
<circle class="progress-ring-circle" cx="34" cy="34" fill="none" r="29" stroke="#c91677" stroke-dasharray="182.2" stroke-dashoffset="0" stroke-width="4.5"></circle>
</svg>
<span class="absolute font-serif font-bold text-[13px] text-neutral-900 tracking-tight">100 %</span>
</div>
<span class="text-xs text-neutral-500 font-medium mt-2">Flashcards</span>
</div>
<!-- Metric 2: Écriture Ring -->
<div class="flex flex-col items-center">
<div class="relative w-[68px] h-[68px] flex items-center justify-center">
<svg class="w-full h-full" viewbox="0 0 68 68">
<!-- Background Track -->
<circle cx="34" cy="34" fill="none" r="29" stroke="#fce7f3" stroke-width="4.5"></circle>
<!-- 95% Magenta Ring -->
<circle class="progress-ring-circle" cx="34" cy="34" fill="none" r="29" stroke="#c91677" stroke-dasharray="182.2" stroke-dashoffset="9.11" stroke-width="4.5"></circle>
</svg>
<span class="absolute font-serif font-bold text-[13px] text-neutral-900 tracking-tight">95 %</span>
</div>
<span class="text-xs text-neutral-500 font-medium mt-2">Écriture</span>
</div>
<!-- Metric 3: Durée -->
<div class="flex flex-col items-center justify-center">
<div class="h-[68px] flex items-center justify-center">
<span class="font-serif font-bold text-[20px] text-neutral-900 leading-none">4 min</span>
</div>
<span class="text-xs text-neutral-500 font-medium mt-2">Durée</span>
</div>
</section>
<!-- END: Metrics Overview Card -->
<!-- BEGIN: Points Detail Card -->
<section class="bg-white rounded-3xl p-5 mt-4 border-2 border-[#c91677] relative shadow-sm" data-purpose="points-breakdown">
<!-- Card Header: Points Gagnés + Nouveau + Total -->
<div class="flex items-center justify-between pb-3 border-b border-neutral-100">
<div class="flex items-center gap-2">
<span class="text-xs font-bold tracking-wider text-[#c91677] uppercase">POINTS GAGNÉS</span>
<span class="bg-[#c91677] text-white text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wide">
            NOUVEAU
          </span>
</div>
<span class="font-serif font-bold text-[26px] text-[#c91677] leading-none">+45</span>
</div>
<!-- List of Earned Points Breakdown -->
<div class="space-y-3 py-3.5">
<!-- Item 1: Écriture -->
<div class="flex justify-between items-center text-sm font-medium">
<span class="text-neutral-700 font-normal">Étape Écriture</span>
<span class="font-serif font-bold text-[16px] text-[#c91677]">+10</span>
</div>
<div class="w-full h-px bg-neutral-100"></div>
<!-- Item 2: Passage terminé -->
<div class="flex justify-between items-center text-sm font-medium">
<span class="text-neutral-700 font-normal">Passage terminé</span>
<span class="font-serif font-bold text-[16px] text-[#c91677]">+30</span>
</div>
<div class="w-full h-px bg-neutral-100"></div>
<!-- Item 3: Jour de série -->
<div class="flex justify-between items-center text-sm font-medium">
<span class="text-neutral-700 font-normal">Jour de série</span>
<span class="font-serif font-bold text-[16px] text-[#c91677]">+5</span>
</div>
</div>
<!-- Level Progression Bar -->
<div class="pt-1" data-purpose="level-progress">
<!-- Progress Bar Background -->
<div class="w-full h-2 bg-[#eae7ec] rounded-full overflow-hidden flex">
<div class="bg-[#c91677] h-full rounded-full" style="width: 72%;"></div>
</div>
<p class="text-[11.5px] font-medium text-neutral-500 mt-2">
          Niveau 5 · 160 pts avant le niveau 6
        </p>
</div>
</section>
<!-- END: Points Detail Card -->
<!-- BEGIN: Family Rank Card -->
<section class="bg-white rounded-2xl p-3.5 mt-3 border border-neutral-100/90 shadow-sm flex items-center justify-between" data-purpose="family-ranking">
<div class="flex items-center gap-3">
<!-- Avatar circle with 'L' -->
<div class="w-10 h-10 rounded-full bg-[#c91677] flex items-center justify-center text-white font-bold text-base shadow-sm shrink-0">
          L
        </div>
<div class="flex flex-col">
<h2 class="text-sm font-bold text-neutral-900 leading-tight">1re de la famille</h2>
<p class="text-[11.5px] text-neutral-500 font-normal mt-0.5">312 pts cette semaine · 44 d’avance</p>
</div>
</div>
<!-- Right chevron arrow -->
<div class="text-neutral-500 pr-1">
<svg class="w-4 h-4 stroke-[2.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</section>
<!-- END: Family Rank Card -->
<!-- BEGIN: Action Navigation Footer -->
<footer class="mt-5 space-y-3" data-purpose="action-buttons">
<!-- Primary Action Button -->
<button class="w-full bg-[#c91677] active:bg-[#af0e65] text-white font-semibold text-[15px] py-4 rounded-full shadow-md shadow-pink-200 transition-all duration-150 transform active:scale-[0.99] focus:outline-none">
        Passage suivant
      </button>
<!-- Secondary Dual Action Buttons -->
<div class="grid grid-cols-2 gap-3">
<button class="w-full bg-white active:bg-neutral-50 text-neutral-800 font-medium text-[13.5px] py-3.5 px-3 rounded-full border border-neutral-200 shadow-sm text-center transition-colors">
          Voir le classement
        </button>
<button class="w-full bg-white active:bg-neutral-50 text-neutral-800 font-medium text-[13.5px] py-3.5 px-3 rounded-full border border-neutral-200 shadow-sm text-center transition-colors">
          Accueil
        </button>
</div>
</footer>
<!-- END: Action Navigation Footer -->
</main>
<!-- END: Mobile Device Container -->
</body></html>
