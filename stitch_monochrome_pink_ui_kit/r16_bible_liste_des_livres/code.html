<!DOCTYPE html><html class="h-full bg-neutral-100" lang="fr"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<title>Bible - Liste des livres</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Inter & Newsreader / Playfair Display -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,600&amp;display=swap" rel="stylesheet">
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            serif: ['"Playfair Display"', '"Source Serif 4"', 'Georgia', 'serif'],
          },
          colors: {
            primaryPink: '#b91c64',
            lightPinkBg: '#fdf2f4',
            badgePinkBg: '#fce7ee',
            badgePinkText: '#a21caf',
            grayPill: '#ebebeb',
            searchBg: '#ededed',
            subText: '#6b7280',
          }
        }
      }
    }
  </script>
<style data-purpose="custom-scroll-and-typography">
    /* Masquage de la barre de scroll pour esthétique application mobile native iOS */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    
    /* Typographie serif fidèle aux titres de chapitres et de livres */
    .font-bible {
      font-family: 'Playfair Display', 'Source Serif 4', Georgia, serif;
    }
  </style>
</head>
<body class="h-full w-full flex justify-center items-center bg-neutral-200 antialiased select-none font-sans">
<!-- BEGIN: PhoneFrameWrapper -->
<!-- Conteneur dimensionné au ratio standard iPhone (390 x 844 pt) -->
<div class="relative w-full max-w-[390px] h-full max-h-[844px] bg-white overflow-hidden flex flex-col shadow-2xl sm:rounded-[44px] sm:border-[8px] sm:border-black/5">
<!-- BEGIN: iOSStatusBar -->
<header class="w-full pt-3 px-6 pb-2 flex justify-between items-center z-30 shrink-0 select-none bg-white">
<!-- Heure iOS -->
<span class="text-[15px] font-semibold tracking-tight text-neutral-900">9:41</span>
<!-- Icônes Réseau & Batterie iOS -->
<div aria-label="État de la connexion et batterie" class="flex items-center space-x-1.5 text-neutral-900">
<span class="text-[12px] font-bold tracking-tight">5G</span>
<!-- Icônes barres réseau & signal -->
<div class="flex items-end gap-[1.5px] h-3 ml-0.5">
<div class="w-[3px] h-1.5 bg-neutral-900 rounded-[0.5px]"></div>
<div class="w-[3px] h-2 bg-neutral-900 rounded-[0.5px]"></div>
<div class="w-[3px] h-2.5 bg-neutral-900 rounded-[0.5px]"></div>
<div class="w-[3px] h-3 bg-neutral-900 rounded-[0.5px]"></div>
</div>
<!-- Icône Batterie -->
<div class="w-5 h-2.5 ml-1 border border-neutral-900 rounded-[3px] p-[1px] flex items-center relative">
<div class="h-full w-full bg-neutral-900 rounded-[1.5px]"></div>
<div class="absolute -right-[3px] top-[2px] w-[2px] h-[4px] bg-neutral-900 rounded-r-sm"></div>
</div>
</div>
</header>
<!-- END: iOSStatusBar -->
<!-- BEGIN: HeaderAndControlsSection -->
<section class="px-5 pt-1 pb-3 flex flex-col gap-3 shrink-0 bg-white">
<!-- Ligne Titre & Sélecteur de Traduction (LSG) -->
<div class="flex justify-between items-center">
<h1 class="font-bible text-[38px] font-extrabold tracking-tight text-neutral-950 leading-tight">
          Bible
        </h1>
<!-- Sélecteur LSG -->
<button aria-label="Choisir la version de la Bible" class="flex items-center gap-1.5 bg-[#e9e9ea] hover:bg-neutral-300 text-neutral-900 font-bold text-[13px] px-3.5 py-1.5 rounded-full transition-colors active:scale-95" type="button"><span class="">LSG</span><svg class="w-3.5 h-3.5 text-neutral-800 stroke-[2.2]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"></path></svg></button>
</div>
<!-- Champ de Recherche -->
<div class="relative w-full">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-neutral-500"><svg class="w-4 h-4 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 1010.5 18a7.5 7.5 0 006.15-3.35z"></path></svg></div>
<input class="w-full bg-[#eeeeef] text-neutral-800 placeholder-neutral-500 text-[14px] rounded-xl pl-10 pr-4 py-2.5 border-none focus:ring-1 focus:ring-neutral-400 focus:outline-none transition-all" placeholder="Livre ou référence (Jean 3:16)" type="search">
</div>
<!-- Segmented Control : Ancien / Nouveau Testament -->
<div class="w-full bg-[#e3e3e6] p-1 rounded-xl flex items-center text-[13px] font-semibold">
<button class="flex-1 py-1.5 bg-white text-neutral-900 rounded-[9px] shadow-[0_1px_3px_rgba(0,0,0,0.1)] text-center transition-all" type="button">
          Ancien Testament
        </button>
<button class="flex-1 py-1.5 text-neutral-700 hover:text-neutral-900 text-center transition-all" type="button">
          Nouveau Testament
        </button>
</div>
<!-- Bannière Reprendre la lecture -->
<div class="w-full bg-[#fceef2] hover:bg-[#fcdde5] rounded-2xl p-4 flex items-center justify-between cursor-pointer transition-colors active:scale-[0.99] mt-0.5" role="button" tabindex="0">
<div class="flex flex-col">
<span class="text-[11px] font-extrabold tracking-wider text-[#b8235e] uppercase mb-0.5">
            REPRENDRE LA LECTURE
          </span>
<span class="font-bible text-[20px] font-bold text-neutral-950">
            Psaumes 23
          </span>
</div>
<!-- Flèche droite -->
<svg class="w-4 h-4 text-neutral-700 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M8.25 4.5l7.5 7.5-7.5 7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</section>
<!-- END: HeaderAndControlsSection -->
<!-- BEGIN: BibleBooksList -->
<!-- Liste scrollable des livres -->
<main class="flex-1 overflow-y-auto no-scrollbar px-5 divide-y divide-neutral-100" data-purpose="bible-books-list">
<!-- Item: Genèse -->
<div class="py-3 flex items-center justify-between cursor-pointer group active:opacity-70">
<div>
<h2 class="font-bible text-[21px] text-neutral-900 leading-tight">Genèse</h2>
<p class="text-[13px] text-neutral-500 font-normal">50 chapitres</p>
</div>
<svg class="w-4 h-4 text-neutral-400 group-hover:text-neutral-600 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M8.25 4.5l7.5 7.5-7.5 7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Item: Exode -->
<div class="py-3 flex items-center justify-between cursor-pointer group active:opacity-70">
<div>
<h2 class="font-bible text-[21px] text-neutral-900 leading-tight">Exode</h2>
<p class="text-[13px] text-neutral-500 font-normal">40 chapitres</p>
</div>
<svg class="w-4 h-4 text-neutral-400 group-hover:text-neutral-600 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M8.25 4.5l7.5 7.5-7.5 7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Item: Josué -->
<div class="py-3 flex items-center justify-between cursor-pointer group active:opacity-70">
<div>
<h2 class="font-bible text-[21px] text-neutral-900 leading-tight">Josué</h2>
<p class="text-[13px] text-neutral-500 font-normal">24 chapitres</p>
</div>
<svg class="w-4 h-4 text-neutral-400 group-hover:text-neutral-600 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M8.25 4.5l7.5 7.5-7.5 7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Item: Job -->
<div class="py-3 flex items-center justify-between cursor-pointer group active:opacity-70">
<div>
<h2 class="font-bible text-[21px] text-neutral-900 leading-tight">Job</h2>
<p class="text-[13px] text-neutral-500 font-normal">42 chapitres</p>
</div>
<svg class="w-4 h-4 text-neutral-400 group-hover:text-neutral-600 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M8.25 4.5l7.5 7.5-7.5 7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Item: Psaumes avec Badge '3 versets' -->
<div class="py-3 flex items-center justify-between cursor-pointer group active:opacity-70">
<div>
<h2 class="font-bible text-[21px] text-neutral-900 leading-tight">Psaumes</h2>
<p class="text-[13px] text-neutral-500 font-normal">150 chapitres</p>
</div>
<div class="flex items-center gap-2">
<!-- Badge 3 versets -->
<span class="bg-[#fdebf1] text-[#b9235e] font-semibold text-[12px] px-2.5 py-0.5 rounded-full">
            3 versets
          </span>
<svg class="w-4 h-4 text-neutral-400 group-hover:text-neutral-600 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M8.25 4.5l7.5 7.5-7.5 7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</div>
<!-- Item: Proverbes -->
<div class="py-3 flex items-center justify-between cursor-pointer group active:opacity-70">
<div>
<h2 class="font-bible text-[21px] text-neutral-900 leading-tight">Proverbes</h2>
<p class="text-[13px] text-neutral-500 font-normal">31 chapitres</p>
</div>
<svg class="w-4 h-4 text-neutral-400 group-hover:text-neutral-600 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M8.25 4.5l7.5 7.5-7.5 7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Item: Ésaïe -->
<div class="py-3 flex items-center justify-between cursor-pointer group active:opacity-70">
<div>
<h2 class="font-bible text-[21px] text-neutral-900 leading-tight">Ésaïe</h2>
<p class="text-[13px] text-neutral-500 font-normal">66 chapitres</p>
</div>
<svg class="w-4 h-4 text-neutral-400 group-hover:text-neutral-600 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M8.25 4.5l7.5 7.5-7.5 7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Item: Jérémie (légèrement coupé en bas) -->
<div class="py-3 flex items-center justify-between cursor-pointer group opacity-90 pb-8">
<div>
<h2 class="font-bible text-[21px] text-neutral-900 leading-tight">Jérémie</h2>
<p class="text-[13px] text-neutral-500 font-normal">52 chapitres</p>
</div>
<svg class="w-4 h-4 text-neutral-400 group-hover:text-neutral-600 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M8.25 4.5l7.5 7.5-7.5 7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</main>
<!-- END: BibleBooksList -->
<!-- BEGIN: BottomNavigationBar -->
<!-- Barre de navigation inférieure fixe style iOS -->
<nav aria-label="Navigation principale" class="shrink-0 bg-white border-t border-neutral-200/80 px-2 pt-2 pb-5 flex justify-around items-center z-30">
<!-- Onglet: Accueil -->
<button class="flex flex-col items-center justify-center w-16 text-neutral-600 hover:text-neutral-900 transition-colors">
<svg class="w-6 h-6 stroke-[1.8]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[10px] font-medium mt-1">Accueil</span>
</button>
<!-- Onglet: Bible (Actif) -->
<button aria-current="page" class="flex flex-col items-center justify-center w-16 text-[#d81b60] transition-colors"><div class="w-6 h-6 flex items-center justify-center"><svg class="w-5 h-5 fill-transparent stroke-[#d81b60] stroke-[2]" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25"></path></svg></div><span class="text-[10px] font-semibold mt-1">Bible</span></button>
<!-- Onglet: Mémoriser -->
<button class="flex flex-col items-center justify-center w-16 text-neutral-600 hover:text-neutral-900 transition-colors">
<svg class="w-6 h-6 stroke-[1.8]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M6.429 9.75L2.25 12l4.179 2.25m0-4.5l5.571 3 5.571-3m-11.142 0L2.25 7.5 12 2.25l9.75 5.25-4.179 2.25m0 0L21.75 12l-4.179 2.25m0 0l4.179 2.25L12 21.75 2.25 16.5l4.179-2.25m11.142 0l-5.571 3-5.571-3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[10px] font-medium mt-1">Mémoriser</span>
</button>
<!-- Onglet: Progrès -->
<button class="flex flex-col items-center justify-center w-16 text-neutral-600 hover:text-neutral-900 transition-colors">
<svg class="w-6 h-6 stroke-[1.8]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[10px] font-medium mt-1">Progrès</span>
</button>
<!-- Onglet: Réglages -->
<button class="flex flex-col items-center justify-center w-16 text-neutral-600 hover:text-neutral-900 transition-colors"><svg class="w-6 h-6 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5" fill="currentColor"></circle><circle cx="12" cy="12" r="1.5" fill="currentColor"></circle><circle cx="19" cy="12" r="1.5" fill="currentColor"></circle></svg><span class="text-[10px] font-medium mt-1">Plus</span></button>
</nav>
<!-- END: BottomNavigationBar -->
</div>
<!-- END: PhoneFrameWrapper -->


</body></html>
