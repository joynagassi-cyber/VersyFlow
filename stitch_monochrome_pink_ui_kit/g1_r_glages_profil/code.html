<!DOCTYPE html>

<html lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>G1 — Réglages — Profil</title>
<!-- Tailwind CSS CDN with forms and container-queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            appPink: '#c2185b',
            appPinkActive: '#d81b60',
            bgCanvas: '#faf8f8',
            subText: '#686666',
            borderSep: '#e6e4e4',
            destructiveRed: '#c53929'
          },
          fontFamily: {
            serif: ['Georgia', 'Cambria', '"Times New Roman"', 'serif'],
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
          }
        }
      }
    }
  </script>
<style data-purpose="base-styling">
    body {
      background-color: #f2f2f6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    /* Hide default form field appearance for seamless underline look */
    .clean-input {
      border: none;
      background: transparent;
      padding-left: 0;
      padding-right: 0;
      width: 100%;
    }
    .clean-input:focus {
      outline: none;
      box-shadow: none;
      border-color: transparent;
    }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen">
<!-- BEGIN: MobileDeviceFrame -->
<div class="w-full max-w-[390px] min-h-[844px] bg-[#fbf9f9] text-[#1c1c1e] flex flex-col justify-between shadow-2xl relative overflow-hidden select-none font-sans">
<!-- Top Content Area -->
<div class="w-full flex-1 pb-24">
<!-- BEGIN: StatusBar -->
<div class="w-full h-11 px-7 pt-3.5 flex justify-between items-center text-black text-sm font-semibold tracking-tight" data-purpose="status-bar">
<span>9:41</span>
<div class="flex items-center space-x-1.5">
<span class="text-xs font-bold tracking-tight">5G</span>
<!-- Signal and Battery Icons -->
<div class="flex items-end space-x-[2px] h-3">
<span class="w-[3px] h-1.5 bg-black rounded-xs"></span>
<span class="w-[3px] h-2 bg-black rounded-xs"></span>
<span class="w-[3px] h-2.5 bg-black rounded-xs"></span>
<span class="w-[3px] h-3 bg-black rounded-xs"></span>
</div>
<!-- Battery icon -->
<div class="w-5 h-2.5 border border-black rounded-[3px] p-[1px] flex items-center ml-1">
<div class="w-full h-full bg-black rounded-[1.5px]"></div>
</div>
</div>
</div>
<!-- END: StatusBar -->
<!-- BEGIN: Header -->
<header class="w-full px-5 pt-1 pb-3 flex items-center border-b border-[#ece8e8]" data-purpose="page-header">
<button aria-label="Retour" class="p-1 -ml-1 text-black focus:outline-none" type="button">
<svg class="w-6 h-6 stroke-[2.2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<h1 class="text-[20px] font-bold text-black font-serif tracking-tight ml-4">
          Mon profil
        </h1>
</header>
<!-- END: Header -->
<!-- BEGIN: ProfileAvatarSection -->
<section class="flex flex-col items-center pt-6 pb-4" data-purpose="profile-avatar">
<!-- Circular Avatar with letter J -->
<div class="w-24 h-24 rounded-full border-[1.5px] border-black flex items-center justify-center bg-transparent">
<span class="text-3xl font-serif text-black font-normal">J</span>
</div>
<!-- Change Photo Button -->
<button class="mt-3 text-[#d81b60] text-[13.5px] font-semibold tracking-normal focus:outline-none hover:opacity-80" type="button">
          Changer la photo
        </button>
</section>
<!-- END: ProfileAvatarSection -->
<!-- BEGIN: PersonalDetailsForm -->
<section class="px-5 pt-1 space-y-4" data-purpose="profile-fields">
<!-- Field: Prénom -->
<div class="border-b border-[#dedede] pb-2">
<label class="block text-[13px] text-[#6b6969] font-normal mb-0.5">Prénom</label>
<div class="text-[17px] font-bold text-black tracking-normal">
            Léa
          </div>
</div>
<!-- Field: Alias (rôle personnalisé) -->
<div class="border-b border-[#dedede] pb-1">
<label class="block text-[13px] text-[#6b6969] font-normal mb-0.5">Alias (rôle personnalisé)</label>
<div class="text-[17px] font-serif italic font-bold text-black tracking-tight leading-snug">
            Gardienne du Psaume 23
          </div>
<!-- Counter under alias -->
<div class="text-right text-[11px] text-[#787575] mt-0.5 font-sans">
            23 / 30
          </div>
</div>
<!-- Field: Objectif personnel -->
<div class="border-b border-[#dedede] pb-2">
<label class="block text-[13px] text-[#6b6969] font-normal mb-0.5">Objectif personnel</label>
<div class="text-[17px] font-bold text-black tracking-normal">
            5 versets par jour
          </div>
</div>
<!-- Field: Date de début -->
<div class="border-b border-[#dedede] pb-2">
<label class="block text-[13px] text-[#6b6969] font-normal mb-0.5">Date de début</label>
<div class="text-[17px] font-bold text-black tracking-normal">
            7 octobre 2026
          </div>
</div>
</section>
<!-- END: PersonalDetailsForm -->
<!-- Section Divider -->
<div class="w-full border-t border-[#dedede] mt-6 mb-6"></div>
<!-- BEGIN: DataManagementSection -->
<section class="px-5" data-purpose="data-management">
<h2 class="text-[19px] font-bold font-serif text-black mb-4">Mes données</h2>
<!-- Action: Exporter ma progression -->
<div class="flex items-center justify-between py-2 cursor-pointer active:opacity-70">
<span class="text-[16px] text-black tracking-tight">Exporter ma progression</span>
<svg class="w-4 h-4 text-[#8a8888] stroke-[2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Switch: Sauvegarde automatique -->
<div class="flex items-center justify-between pt-4 pb-2">
<div class="flex flex-col">
<span class="text-[16px] text-black tracking-tight leading-snug">Sauvegarde automatique</span>
<span class="text-[13px] text-[#737171] mt-0.5">Sur cet appareil</span>
</div>
<!-- Toggle switch (active pink state) -->
<div class="w-[50px] h-[30px] bg-[#d81b60] rounded-full p-[2px] flex items-center justify-end shadow-inner cursor-pointer">
<div class="w-[26px] h-[26px] bg-white rounded-full flex items-center justify-center shadow-sm">
<!-- Small checkmark inside switch thumb -->
<svg class="w-3.5 h-3.5 text-[#d81b60] stroke-[2.8]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</div>
</div>
</section>
<!-- END: DataManagementSection -->
<!-- Section Divider -->
<div class="w-full border-t border-[#dedede] mt-4 mb-6"></div>
<!-- BEGIN: AccountSection -->
<section class="px-5" data-purpose="account-management">
<h2 class="text-[19px] font-bold font-serif text-black mb-4">Compte</h2>
<!-- Action: Informations privées -->
<div class="flex items-center justify-between py-2 cursor-pointer active:opacity-70">
<span class="text-[16px] text-black tracking-tight">Informations privées</span>
<svg class="w-4 h-4 text-[#8a8888] stroke-[2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Action: Supprimer mon profil -->
<div class="pt-6 pb-2">
<button class="text-[16px] text-[#b3261e] tracking-tight hover:underline focus:outline-none" type="button">
            Supprimer mon profil
          </button>
</div>
</section>
<!-- END: AccountSection -->
</div>
<!-- BEGIN: BottomNavigation -->
<nav class="absolute bottom-0 left-0 right-0 h-[68px] bg-[#fbf9f9] border-t border-[#dedede] px-3 flex justify-around items-center" data-purpose="bottom-navigation-bar">
<!-- Tab 1: Accueil -->
<a class="flex flex-col items-center justify-center w-14 text-[#262626] hover:opacity-80" href="#">
<svg class="w-6 h-6 stroke-[1.8]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[10px] mt-1 font-medium tracking-tight">Accueil</span>
</a>
<!-- Tab 2: Bible -->
<a class="flex flex-col items-center justify-center w-14 text-[#262626] hover:opacity-80" href="#">
<svg class="w-6 h-6 stroke-[1.8]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<rect height="16" rx="2" stroke-linecap="round" stroke-linejoin="round" width="14" x="5" y="4"></rect>
</svg>
<span class="text-[10px] mt-1 font-medium tracking-tight">Bible</span>
</a>
<!-- Tab 3: Mémoriser -->
<a class="flex flex-col items-center justify-center w-14 text-[#262626] hover:opacity-80" href="#">
<svg class="w-6 h-6 stroke-[1.8]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[10px] mt-1 font-medium tracking-tight">Mémoriser</span>
</a>
<!-- Tab 4: Progrès -->
<a class="flex flex-col items-center justify-center w-14 text-[#262626] hover:opacity-80" href="#">
<svg class="w-6 h-6 stroke-[1.8]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[10px] mt-1 font-medium tracking-tight">Progrès</span>
</a>
<!-- Tab 5: Réglages (Active) -->
<a class="flex flex-col items-center justify-center w-14 text-[#d81b60]" href="#">
<!-- Sun/Settings spark icon -->
<svg class="w-6 h-6 stroke-[2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[10px] mt-1 font-semibold tracking-tight text-[#d81b60]">Réglages</span>
</a>
</nav>
<!-- END: BottomNavigation -->
</div>
<!-- END: MobileDeviceFrame -->
</body></html>
