<!DOCTYPE html>

<html lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Réglages</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              pink: '#e01e69',
              pinkLight: '#fde7ef',
              pinkBadge: '#f8d2e2',
              dark: '#1c1917',
              graySub: '#686663',
              borderCard: '#e60067'
            }
          },
          fontFamily: {
            serif: ['Georgia', 'Cambria', '"Times New Roman"', 'Times', 'serif'],
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
          }
        }
      }
    }
  </script>
<style data-purpose="custom-layout">
    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #f7f7f7;
    }
    .safe-top {
      padding-top: env(safe-area-inset-top, 0px);
    }
    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen p-0 sm:p-4 text-stone-900 font-sans select-none">
<!-- Mobile Screen Container (iOS Form Factor) -->
<div class="relative w-full max-w-[390px] h-[844px] bg-white overflow-hidden shadow-2xl flex flex-col sm:rounded-[44px]">
<!-- BEGIN: StatusBar -->
<header class="w-full pt-3 px-7 pb-1 flex justify-between items-center text-stone-900 text-[14px] font-semibold tracking-tight z-30" data-purpose="ios-status-bar">
<span>9:41</span>
<div class="flex items-center space-x-1.5 text-xs font-bold">
<span>5G</span>
<!-- Cellular Bars -->
<div aria-label="Signal 3 bars" class="flex items-end space-x-[2px] h-3 ml-0.5">
<span class="w-[3px] h-1.5 bg-black rounded-xs"></span>
<span class="w-[3px] h-2 bg-black rounded-xs"></span>
<span class="w-[3px] h-3 bg-black rounded-xs"></span>
<span class="w-[3px] h-3 bg-stone-300 rounded-xs"></span>
</div>
</div>
</header>
<!-- END: StatusBar -->
<!-- BEGIN: NavigationBar -->
<nav class="relative flex items-center justify-center px-4 py-3 border-b border-stone-100 bg-white z-20" data-purpose="top-navigation">
<button aria-label="Retour" class="absolute left-4 top-1/2 -translate-y-1/2 p-2 -ml-2 text-stone-800 hover:opacity-70 transition" type="button">
<svg class="w-5 h-5 stroke-[2.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15.75 19.5L8.25 12l7.5-7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<h1 class="font-serif text-[22px] font-bold tracking-tight text-stone-900">Réglages</h1>
</nav>
<!-- END: NavigationBar -->
<!-- BEGIN: MainContent -->
<main class="flex-1 overflow-y-auto px-5 pt-4 pb-24 space-y-6 scrollbar-none" data-purpose="settings-content">
<!-- BEGIN: FamilyCardSection -->
<section class="rounded-[26px] border-[2px] border-brand-borderCard p-5 bg-white shadow-sm transition-shadow" data-purpose="family-highlight-card">
<!-- Header row of the Card -->
<div class="flex items-center justify-between mb-4">
<div class="flex items-center space-x-2">
<h2 class="font-serif text-[19px] font-bold text-stone-900">Famille</h2>
<span class="bg-brand-pink text-white text-[10px] font-extrabold px-2 py-0.5 rounded-full tracking-wider uppercase">NOUVEAU</span>
</div>
<!-- Profile switcher pill -->
<button class="bg-[#fce5ee] text-stone-900 text-xs font-semibold px-3 py-1 rounded-full flex items-center space-x-1 hover:bg-[#fad4e3] transition" type="button">
<span>Léa</span>
<span class="text-[9px] text-stone-800 ml-0.5">▼</span>
</button>
</div>
<!-- Avatars and Family Info -->
<div class="flex items-center justify-between py-1 border-b border-transparent">
<!-- Overlapping Avatar Circles -->
<div class="flex items-center -space-x-2.5">
<div class="w-8 h-8 rounded-full bg-[#e91e63] text-white flex items-center justify-center font-bold text-xs border-2 border-white shadow-sm ring-1 ring-black/5">L</div>
<div class="w-8 h-8 rounded-full bg-[#1e88e5] text-white flex items-center justify-center font-bold text-xs border-2 border-white shadow-sm ring-1 ring-black/5">M</div>
<div class="w-8 h-8 rounded-full bg-[#2e7d32] text-white flex items-center justify-center font-bold text-xs border-2 border-white shadow-sm ring-1 ring-black/5">A</div>
<div class="w-8 h-8 rounded-full bg-[#f57f17] text-white flex items-center justify-center font-bold text-xs border-2 border-white shadow-sm ring-1 ring-black/5">D</div>
<div class="w-8 h-8 rounded-full bg-[#7e57c2] text-white flex items-center justify-center font-bold text-xs border-2 border-white shadow-sm ring-1 ring-black/5">N</div>
</div>
<!-- Members count subtitle -->
<div class="text-[13px] text-stone-600 font-normal">
            Famille Étoile · 5 membres
          </div>
</div>
<!-- Action Items Inside Family Card -->
<div class="mt-4 space-y-1">
<!-- Item: Changer de profil -->
<button class="w-full flex items-center justify-between py-3 text-left group" type="button">
<span class="text-[16px] text-stone-800 font-normal">Changer de profil</span>
<svg class="w-3.5 h-3.5 text-stone-400 stroke-[2] group-hover:translate-x-0.5 transition" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M8.25 4.5l7.5 7.5-7.5 7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Item: Réglages Famille -->
<button class="w-full flex items-center justify-between py-3 text-left group" type="button">
<span class="text-[16px] text-stone-800 font-normal">Réglages Famille</span>
<svg class="w-3.5 h-3.5 text-stone-400 stroke-[2] group-hover:translate-x-0.5 transition" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M8.25 4.5l7.5 7.5-7.5 7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Item: Défis d'équipe -->
<div class="w-full flex items-center justify-between py-2 text-left">
<span class="text-[16px] text-stone-800 font-normal">Défis d’équipe</span>
<span class="text-[14px] text-stone-600 font-normal">2 en cours</span>
</div>
</div>
</section>
<!-- END: FamilyCardSection -->
<!-- BEGIN: BibleReadingSection -->
<section class="space-y-4 pt-1" data-purpose="bible-reading-settings">
<h2 class="font-serif text-[19px] font-bold text-stone-900 tracking-tight">Lecture de la Bible</h2>
<!-- Option: Police -->
<div class="flex items-center justify-between py-1.5 cursor-pointer">
<span class="text-[16px] text-stone-900 font-normal">Police</span>
<span class="text-[15px] text-stone-600 font-normal">Georgia</span>
</div>
<!-- Option: Afficher les notes de bas de page with Toggle -->
<div class="flex items-center justify-between py-1">
<div class="flex flex-col pr-2">
<span class="text-[16px] text-stone-900 font-normal leading-tight">Afficher les notes de bas de page</span>
<span class="text-[13px] text-stone-500 font-normal mt-0.5">Selon disponibilité</span>
</div>
<!-- Custom Active iOS Switch with Checkmark -->
<div aria-checked="true" class="relative inline-flex h-[31px] w-[51px] shrink-0 cursor-pointer rounded-full bg-brand-pink transition-colors duration-200 ease-in-out" role="switch">
<span class="translate-x-[22px] pointer-events-none inline-flex items-center justify-center h-[27px] w-[27px] transform rounded-full bg-white shadow-md ring-0 transition duration-200 ease-in-out my-0.5">
<svg class="h-3.5 w-3.5 text-brand-pink stroke-[3]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M4.5 12.75l6 6 9-13.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</span>
</div>
</div>
</section>
<!-- END: BibleReadingSection -->
<!-- BEGIN: MemorizationSection -->
<section class="space-y-4 pt-2" data-purpose="memorization-settings">
<h2 class="font-serif text-[19px] font-bold text-stone-900 tracking-tight">Mémorisation</h2>
<!-- Option: Mode de départ -->
<div class="flex items-center justify-between py-1.5 cursor-pointer">
<span class="text-[16px] text-stone-900 font-normal">Mode de départ</span>
<span class="text-[15px] text-stone-600 font-normal">Révélation</span>
</div>
<!-- Option: Unité de révélation -->
<div class="flex items-center justify-between py-1.5 cursor-pointer opacity-70">
<span class="text-[16px] text-stone-900 font-normal">Unité de révélation</span>
<span class="text-[15px] text-stone-600 font-normal">Phrase</span>
</div>
</section>
<!-- END: MemorizationSection -->
</main>
<!-- END: MainContent -->
<!-- BEGIN: BottomNavigation -->
<footer class="absolute bottom-0 left-0 right-0 h-[68px] bg-white border-t border-stone-200/80 px-2 flex justify-around items-center z-30" data-purpose="bottom-tab-bar">
<!-- Tab: Accueil -->
<button class="flex flex-col items-center justify-center w-14 text-stone-700 hover:text-stone-900" type="button">
<svg class="w-6 h-6 stroke-[1.8]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[10px] mt-1 font-medium tracking-tight">Accueil</span>
</button>
<!-- Tab: Bible -->
<button class="flex flex-col items-center justify-center w-14 text-stone-700 hover:text-stone-900" type="button">
<svg class="w-6 h-6 stroke-[1.8]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[10px] mt-1 font-medium tracking-tight">Bible</span>
</button>
<!-- Tab: Mémoriser -->
<button class="flex flex-col items-center justify-center w-14 text-stone-700 hover:text-stone-900" type="button">
<svg class="w-6 h-6 stroke-[1.8]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M6.429 9.75L2.25 12l4.179 2.25m0-4.5l5.571 3 5.571-3m-11.142 0L2.25 7.5 12 2.25l9.75 5.25-4.179 2.25m0 0L21.75 12l-4.179 2.25m0 0l4.179 2.25L12 21.75 2.25 16.5l4.179-2.25m11.142 0l-5.571 3-5.571-3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[10px] mt-1 font-medium tracking-tight">Mémoriser</span>
</button>
<!-- Tab: Progrès -->
<button class="flex flex-col items-center justify-center w-14 text-stone-700 hover:text-stone-900" type="button">
<svg class="w-6 h-6 stroke-[1.8]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[10px] mt-1 font-medium tracking-tight">Progrès</span>
</button>
<!-- Tab: Réglages (Active) -->
<button class="flex flex-col items-center justify-center w-14 text-brand-pink font-semibold" type="button">
<svg class="w-6 h-6 stroke-[2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[10px] mt-1 font-semibold tracking-tight">Réglages</span>
</button>
</footer>
<!-- END: BottomNavigation -->
</div>
</body></html>
