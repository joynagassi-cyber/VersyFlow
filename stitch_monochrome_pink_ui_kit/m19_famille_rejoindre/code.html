<!DOCTYPE html>

<html lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Rejoindre une famille</title>
<!-- Tailwind CSS v3 CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              magenta: '#CE0078',
              pinkSoft: '#FFEDF6',
              lightGray: '#F9F9FB',
              borderCard: '#F252A1',
            }
          },
          fontFamily: {
            serif: ['Georgia', 'serif'],
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"Segoe UI"', 'Roboto', 'sans-serif']
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Typography and Base Styles -->
<style data-purpose="custom-typography">
    .font-serif-title {
      font-family: 'Georgia', serif;
    }
    body {
      background-color: #FAFAFB;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
<!-- END: Custom Typography and Base Styles -->
</head>
<body class="min-h-screen text-slate-800 flex justify-center bg-gray-100">
<!-- Mobile Screen Shell (iOS viewport proportion) -->
<div class="w-full max-w-[410px] min-h-screen bg-[#FCFCFD] flex flex-col justify-between relative shadow-xl overflow-x-hidden">
<!-- Top Screen Content Area -->
<div class="px-5 pt-3">
<!-- BEGIN: StatusBar -->
<div class="w-full flex justify-between items-center text-xs font-semibold text-black tracking-tight pt-1 pb-3" data-purpose="ios-status-bar">
<span>9:41</span>
<div class="flex items-center space-x-1.5">
<span class="text-[11px] font-bold">5G</span>
<!-- Signal bars mock -->
<div class="flex items-end space-x-0.5 h-3">
<span class="w-[3px] h-1.5 bg-black rounded-sm"></span>
<span class="w-[3px] h-2 bg-black rounded-sm"></span>
<span class="w-[3px] h-3 bg-black rounded-sm"></span>
</div>
</div>
</div>
<!-- END: StatusBar -->
<!-- BEGIN: NavigationHeader -->
<header class="relative flex items-center justify-between py-2" data-purpose="screen-header">
<!-- Back Button -->
<button aria-label="Retour" class="w-11 h-11 rounded-full bg-white shadow-sm border border-gray-100 flex items-center justify-center text-gray-700 active:scale-95 transition-transform" type="button">
<svg class="w-5 h-5 stroke-[2.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Center Titles -->
<div class="text-center">
<h1 class="font-serif-title font-bold text-[22px] leading-tight text-neutral-900 tracking-tight">
            Rejoindre une famille
          </h1>
<p class="text-[13px] text-gray-500 font-normal mt-0.5">
            Étape 1 sur 2
          </p>
</div>
<!-- Options Button -->
<button aria-label="Options" class="w-11 h-11 rounded-full bg-white shadow-sm border border-gray-100 flex items-center justify-center text-gray-700 active:scale-95 transition-transform" type="button">
<svg class="w-5 h-5 fill-current" viewbox="0 0 24 24">
<circle cx="5" cy="12" r="2"></circle>
<circle cx="12" cy="12" r="2"></circle>
<circle cx="19" cy="12" r="2"></circle>
</svg>
</button>
</header>
<!-- END: NavigationHeader -->
<!-- BEGIN: MainContent -->
<main class="mt-6 flex flex-col">
<!-- Helper Label -->
<p class="text-[13px] text-gray-600 font-medium tracking-tight mb-2.5">
          Saisis le code reçu
        </p>
<!-- Code Input Boxes (6 digits) -->
<div class="grid grid-cols-6 gap-2 w-full" data-purpose="pin-input-boxes">
<!-- Digit 1 -->
<div class="h-[60px] bg-white border border-gray-200 rounded-2xl flex items-center justify-center shadow-sm">
<span class="font-serif-title font-bold text-2xl text-neutral-900">7</span>
</div>
<!-- Digit 2 -->
<div class="h-[60px] bg-white border border-gray-200 rounded-2xl flex items-center justify-center shadow-sm">
<span class="font-serif-title font-bold text-2xl text-neutral-900">K</span>
</div>
<!-- Digit 3 -->
<div class="h-[60px] bg-white border border-gray-200 rounded-2xl flex items-center justify-center shadow-sm">
<span class="font-serif-title font-bold text-2xl text-neutral-900">4</span>
</div>
<!-- Digit 4 -->
<div class="h-[60px] bg-white border border-gray-200 rounded-2xl flex items-center justify-center shadow-sm">
<span class="font-serif-title font-bold text-2xl text-neutral-900">M</span>
</div>
<!-- Digit 5 -->
<div class="h-[60px] bg-white border border-gray-200 rounded-2xl flex items-center justify-center shadow-sm">
<span class="font-serif-title font-bold text-2xl text-neutral-900">P</span>
</div>
<!-- Digit 6 (Active / Focused state) -->
<div class="h-[60px] bg-white border-2 border-[#E4007F] rounded-2xl flex items-center justify-center shadow-sm">
<span class="font-serif-title font-bold text-2xl text-neutral-900">2</span>
</div>
</div>
<!-- BEGIN: FamilyFoundCard -->
<section class="mt-6 bg-white border-2 border-[#FA2B94] rounded-[26px] p-5 shadow-sm" data-purpose="family-found-card">
<p class="text-[11px] font-bold tracking-wider text-[#D10074] uppercase">
            Famille trouvée
          </p>
<div class="flex items-center justify-between mt-1">
<h2 class="font-serif-title font-bold text-[21px] text-neutral-900">
              Famille Étoile
            </h2>
<span class="bg-[#E7F6EA] text-[#1E874B] text-[12px] font-semibold px-3 py-1 rounded-full">
              5 membres
            </span>
</div>
<!-- Overlapping Avatars -->
<div class="flex items-center mt-3 -space-x-2">
<!-- Avatar L -->
<div class="w-10 h-10 rounded-full bg-[#E6007E] text-white font-bold flex items-center justify-center text-sm border-2 border-white shadow-sm">
              L
            </div>
<!-- Avatar M -->
<div class="w-10 h-10 rounded-full bg-[#2680EB] text-white font-bold flex items-center justify-center text-sm border-2 border-white shadow-sm">
              M
            </div>
<!-- Avatar A -->
<div class="w-10 h-10 rounded-full bg-[#25A26B] text-white font-bold flex items-center justify-center text-sm border-2 border-white shadow-sm">
              A
            </div>
<!-- Avatar D -->
<div class="w-10 h-10 rounded-full bg-[#E5A91A] text-white font-bold flex items-center justify-center text-sm border-2 border-white shadow-sm">
              D
            </div>
<!-- Avatar N -->
<div class="w-10 h-10 rounded-full bg-[#7C51CF] text-white font-bold flex items-center justify-center text-sm border-2 border-white shadow-sm">
              N
            </div>
</div>
</section>
<!-- END: FamilyFoundCard -->
<!-- Section: Qui es-tu ? -->
<div class="mt-7">
<h3 class="text-[11px] font-bold tracking-wider text-[#A10959] uppercase mb-3">
            Qui es-tu ?
          </h3>
<!-- Selection Card -->
<div class="bg-white rounded-3xl border border-gray-100 shadow-[0_4px_16px_rgba(0,0,0,0.04)] overflow-hidden" data-purpose="profile-selector">
<!-- Selected Profile Option (Noé) -->
<div class="p-4 flex items-center justify-between">
<div class="flex items-center space-x-3.5">
<!-- Avatar Noé -->
<div class="w-11 h-11 rounded-full bg-[#7C51CF] text-white font-bold flex items-center justify-center text-base shadow-sm">
                  N
                </div>
<div>
<h4 class="font-bold text-neutral-900 text-[15px] leading-tight">Noé</h4>
<p class="text-xs text-gray-500 italic mt-0.5">Petit mais costaud</p>
</div>
</div>
<!-- Custom Radio Selected -->
<div class="w-6 h-6 rounded-full border-2 border-[#E4007F] flex items-center justify-center">
<div class="w-3 h-3 rounded-full bg-[#E4007F]"></div>
</div>
</div>
<!-- Divider line -->
<div class="h-[1px] bg-gray-100 mx-4"></div>
<!-- Add Profile Option -->
<button class="w-full p-4 flex items-center space-x-3 text-left hover:bg-gray-50 active:bg-gray-100 transition-colors" type="button">
<div class="w-5 h-5 flex items-center justify-center text-[#990059]">
<svg class="w-5 h-5 stroke-[2.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M12 4.5v15m7.5-7.5h-15" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="font-bold text-[15px] text-[#A1005E]">
                Créer un nouveau profil
              </span>
</button>
</div>
</div>
</main>
<!-- END: MainContent -->
</div>
<!-- BEGIN: BottomAction -->
<footer class="p-5 pb-8" data-purpose="fixed-bottom-action">
<button class="w-full py-4 rounded-full bg-[#CE0078] hover:bg-[#B8006B] active:scale-[0.98] text-white font-bold text-base shadow-lg shadow-pink-500/25 transition-all text-center" type="button">
        Rejoindre la famille
      </button>
</footer>
<!-- END: BottomAction -->
</div>
</body></html>
