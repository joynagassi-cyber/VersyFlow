<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" role="img" aria-label="VersyFlow - Mémorisation biblique">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B0812"/>
      <stop offset="0.55" stop-color="#120509"/>
      <stop offset="1" stop-color="#200A16"/>
    </linearGradient>
    <radialGradient id="glowRose" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#E91E8C" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#E91E8C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowDeep" cx="0.1" cy="0.95" r="0.7">
      <stop offset="0" stop-color="#B0286F" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#B0286F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9EC4"/>
      <stop offset="0.5" stop-color="#E91E8C"/>
      <stop offset="1" stop-color="#8E1A5C"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#FFD7E8"/>
      <stop offset="1" stop-color="#FF8FB8"/>
    </linearGradient>
    <linearGradient id="flowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E91E8C"/>
      <stop offset="0.5" stop-color="#FF6BA4"/>
      <stop offset="1" stop-color="#FFB6C9"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#FFFFFF" opacity="0.045"/>
    </pattern>
  </defs>

  <!-- Fond -->
  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect width="1600" height="400" fill="url(#glowRose)"/>
  <rect width="1600" height="400" fill="url(#glowDeep)"/>
  <rect width="1600" height="400" fill="url(#dots)"/>

  <!-- Ribbons "flow" -->
  <path d="M -60 300 C 240 250, 430 340, 720 292 C 950 254, 1180 236, 1660 276" fill="none" stroke="#FF6BA4" stroke-width="14" stroke-linecap="round" opacity="0.06"/>
  <path d="M -60 300 C 240 250, 430 340, 720 292 C 950 254, 1180 236, 1660 276" fill="none" stroke="url(#flowGrad)" stroke-width="3" opacity="0.85"/>
  <path d="M -60 336 C 260 296, 520 360, 840 322 C 1120 290, 1330 282, 1660 316" fill="none" stroke="#FFB6C9" stroke-width="1.5" opacity="0.28"/>

  <!-- Repetition espacée (intervalles croissants) -->
  <g font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#FFB6C9">
    <circle cx="300" cy="297" r="8" fill="none" stroke="#FF6BA4" stroke-opacity="0.45"/>
    <circle cx="300" cy="297" r="4.5" fill="#FF9EC4"/>
    <text x="300" y="328" text-anchor="middle" opacity="0.7">1j</text>
    <circle cx="518" cy="306" r="8" fill="none" stroke="#FF6BA4" stroke-opacity="0.45"/>
    <circle cx="518" cy="306" r="4.5" fill="#FF9EC4"/>
    <text x="518" y="337" text-anchor="middle" opacity="0.7">3j</text>
    <circle cx="636" cy="302" r="8" fill="none" stroke="#FF6BA4" stroke-opacity="0.45"/>
    <circle cx="636" cy="302" r="4.5" fill="#FF9EC4"/>
    <text x="636" y="333" text-anchor="middle" opacity="0.7">7j</text>
    <circle cx="896" cy="268" r="8" fill="none" stroke="#FF6BA4" stroke-opacity="0.45"/>
    <circle cx="896" cy="268" r="4.5" fill="#FF9EC4"/>
    <text x="896" y="299" text-anchor="middle" opacity="0.7">16j</text>
    <circle cx="1188" cy="253" r="8" fill="none" stroke="#FF6BA4" stroke-opacity="0.45"/>
    <circle cx="1188" cy="253" r="4.5" fill="#FF9EC4"/>
    <text x="1188" y="284" text-anchor="middle" opacity="0.7">35j</text>
    <circle cx="1460" cy="262" r="5.5" fill="#FFB6C9" opacity="0.9"/>
  </g>

  <!-- Médallion : livre ouvert + flow -->
  <g>
    <circle cx="170" cy="200" r="78" fill="#FFFFFF" fill-opacity="0.04"/>
    <circle cx="170" cy="200" r="78" fill="none" stroke="#E91E8C" stroke-opacity="0.25"/>
    <circle cx="170" cy="200" r="88" fill="none" stroke="url(#ringGrad)" stroke-width="2.5"/>
    <ellipse cx="170" cy="243" rx="48" ry="6" fill="#000000" opacity="0.28"/>
    <path d="M170 184 C 154 172, 134 169, 122 174 L 122 226 C 135 220, 155 223, 170 232 Z" fill="#FFF7FB"/>
    <path d="M170 184 C 186 172, 206 169, 218 174 L 218 226 C 205 220, 185 223, 170 232 Z" fill="#FBE8F2"/>
    <path d="M170 184 L 170 232" stroke="#E91E8C" stroke-width="2.5" opacity="0.85"/>
    <g stroke="#E91E8C" stroke-width="2" stroke-linecap="round" opacity="0.5" fill="none">
      <path d="M132 186 L 158 192"/>
      <path d="M132 198 L 156 204"/>
      <path d="M132 210 L 152 215"/>
      <path d="M182 192 L 208 186"/>
      <path d="M184 204 L 208 198"/>
      <path d="M186 215 L 204 210"/>
    </g>
    <path d="M218 210 C 246 198, 254 226, 286 214" fill="none" stroke="url(#flowGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <circle cx="286" cy="214" r="3.5" fill="#FF9EC4"/>
    <path d="M252 128 L255.5 140 L268 143.5 L255.5 147 L252 159 L248.5 147 L236 143.5 L248.5 140 Z" fill="#FFC1DC" opacity="0.85"/>
    <path d="M112 128 L114.2 135.8 L122 138 L114.2 140.2 L112 148 L109.8 140.2 L102 138 L109.8 135.8 Z" fill="#FF9EC4" opacity="0.45"/>
  </g>

  <!-- Titre + tagline -->
  <g font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">
    <text x="302" y="112" font-size="14" letter-spacing="4" fill="#FF8FB8" opacity="0.85">APPLI MOBILE · OFFLINE-FIRST · MULTILINGUE</text>
    <text x="300" y="196" font-size="92" font-weight="800" letter-spacing="-2" fill="url(#titleGrad)">VersyFlow</text>
    <text x="304" y="244" font-size="25" fill="#F3C6DC" opacity="0.92">Mémorisation biblique — <tspan fill="#FF8FB8" font-weight="600">Science · Élégance · Foi</tspan></text>
  </g>

  <!-- Chips technologies -->
  <g font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13">
    <g fill="#FFFFFF" fill-opacity="0.045" stroke="#E91E8C" stroke-opacity="0.4">
      <rect x="1060" y="148" width="68" height="40" rx="20"/>
      <rect x="1140" y="148" width="93" height="40" rx="20"/>
      <rect x="1245" y="148" width="86" height="40" rx="20"/>
      <rect x="1343" y="148" width="96" height="40" rx="20"/>
      <rect x="1451" y="148" width="104" height="40" rx="20"/>
    </g>
    <g fill="#FF6BA4">
      <circle cx="1076" cy="168" r="3.5"/>
      <circle cx="1156" cy="168" r="3.5"/>
      <circle cx="1261" cy="168" r="3.5"/>
      <circle cx="1359" cy="168" r="3.5"/>
      <circle cx="1467" cy="168" r="3.5"/>
    </g>
    <g fill="#FFD7E8">
      <text x="1090" y="173">React</text>
      <text x="1170" y="173">Capacitor</text>
      <text x="1275" y="173">Supabase</text>
      <text x="1373" y="173">PowerSync</text>
      <text x="1481" y="173">TypeScript</text>
    </g>
  </g>

  <text x="1555" y="381" text-anchor="end" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#FFB6C9" opacity="0.35">github.com/joynagassi-cyber/VersyFlow</text>
</svg>
