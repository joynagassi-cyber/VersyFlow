<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <!-- Gradient rose frais -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDF0F5;"/>
      <stop offset="50%" style="stop-color:#FFE4EE;"/>
      <stop offset="100%" style="stop-color:#FFB6C9;"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E91E8C;"/>
      <stop offset="100%" style="stop-color:#FF6BA4;"/>
    </linearGradient>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6BA4;"/>
      <stop offset="50%" style="stop-color:#E91E8C;"/>
      <stop offset="100%" style="stop-color:#FFD1E4;"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#E91E8C" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <radialGradient id="accentCircle">
      <stop offset="0%" style="stop-color:#FFB6C9; stop-opacity:0.3;"/>
      <stop offset="100%" style="stop-color:#FFB6C9; stop-opacity:0;"/>
    </radialGradient>
    <!-- Motif de fond subtil -->
    <pattern id="dotPattern" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFB6C9" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Fond principal -->
  <rect width="1200" height="600" fill="url(#bgGrad)"/>
  <rect width="1200" height="600" fill="url(#dotPattern)"/>

  <!-- Cercles d'accentuation -->
  <circle cx="100" cy="80" r="120" fill="url(#accentCircle)"/>
  <circle cx="1100" cy="520" r="150" fill="url(#accentCircle)"/>
  <circle cx="950" cy="60" r="80" fill="url(#accentCircle)"/>

  <!-- Éléments décoratifs abstraits - vagues -->
  <path d="M0 450 Q300 380 600 420 T1200 380 L1200 600 L0 600 Z" fill="#FFB6C9" opacity="0.1"/>
  <path d="M0 500 Q400 440 800 480 T1200 450 L1200 600 L0 600 Z" fill="#E91E8C" opacity="0.05"/>

  <!-- Icône Livre ouvert stylisée -->
  <g transform="translate(120, 200)" filter="url(#shadow)">
    <rect x="0" y="0" width="100" height="130" rx="10" fill="white" stroke="#E91E8C" stroke-width="3"/>
    <line x1="50" y1="0" x2="50" y2="130" stroke="#E91E8C" stroke-width="2"/>
    <!-- Lignes de texte -->
    <line x1="15" y1="25" x2="40" y2="25" stroke="#FF6BA4" stroke-width="3" stroke-linecap="round"/>
    <line x1="60" y1="25" x2="85" y2="25" stroke="#FF6BA4" stroke-width="3" stroke-linecap="round"/>
    <line x1="15" y1="45" x2="40" y2="45" stroke="#E91E8C" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <line x1="60" y1="45" x2="85" y2="45" stroke="#E91E8C" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <line x1="15" y1="65" x2="35" y2="65" stroke="#FF6BA4" stroke-width="3" stroke-linecap="round"/>
    <line x1="60" y1="65" x2="75" y2="65" stroke="#FF6BA4" stroke-width="3" stroke-linecap="round"/>
    <line x1="15" y1="85" x2="40" y2="85" stroke="#E91E8C" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <line x1="60" y1="85" x2="85" y2="85" stroke="#E91E8C" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <line x1="25" y1="105" x2="80" y2="105" stroke="#E91E8C" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  </g>

  <!-- Symboles de flux/mémorisation (cercles connectés) -->
  <g transform="translate(920, 180)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="#E91E8C" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="0" r="25" fill="#E91E8C" opacity="0.15"/>
    <circle cx="-30" cy="-20" r="8" fill="#FF6BA4"/>
    <circle cx="30" cy="-20" r="8" fill="#E91E8C"/>
    <circle cx="0" cy="30" r="8" fill="#FFB6C9"/>
    <line x1="-25" y1="-15" x2="25" y2="-15" stroke="#E91E8C" stroke-width="1.5" opacity="0.4"/>
    <line x1="20" y1="-10" x2="0" y2="25" stroke="#E91E8C" stroke-width="1.5" opacity="0.4"/>
    <line x1="-25" y1="-10" x2="0" y2="25" stroke="#E91E8C" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Barre décorative gauche -->
  <rect x="0" y="0" width="6" height="600" fill="url(#titleGrad)"/>

  <!-- Titre principal -->
  <text x="300" y="220" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="96" font-weight="800" fill="url(#titleGrad)" filter="url(#shadow)">VersyFlow</text>

  <!-- Sous-titre -->
  <text x="300" y="290" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="300" fill="#C2185B" letter-spacing="4">MÉMORISATION BIBLIQUE INTUITIVE</text>

  <!-- Tagline -->
  <text x="300" y="350" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#E91E8C" opacity="0.7" letter-spacing="2">SCIENCE • ÉLÉGANCE • FOI</text>

  <!-- Badges de features -->
  <g transform="translate(300, 400)">
    <rect x="0" y="0" width="200" height="55" rx="27.5" fill="white" stroke="#FFB6C9" stroke-width="2" filter="url(#shadow)"/>
    <text x="100" y="34" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#E91E8C">React Native + Expo</text>
  </g>
  <g transform="translate(520, 400)">
    <rect x="0" y="0" width="190" height="55" rx="27.5" fill="white" stroke="#FFB6C9" stroke-width="2" filter="url(#shadow)"/>
    <text x="95" y="34" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#E91E8C">Moteur FSRS Rust</text>
  </g>
  <g transform="translate(730, 400)">
    <rect x="0" y="0" width="180" height="55" rx="27.5" fill="white" stroke="#FFB6C9" stroke-width="2" filter="url(#shadow)"/>
    <text x="90" y="34" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#E91E8C">Offline First</text>
  </g>

  <!-- Barre décorative droite -->
  <rect x="1194" y="0" width="6" height="600" fill="url(#titleGrad)"/>

  <!-- Petit verset en bas -->
  <text x="300" y="520" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#E91E8C" opacity="0.5">"Ton parole est une lampe à mes pieds, une lumière sur mon sentier." — Psaume 119:105</text>
</svg>
