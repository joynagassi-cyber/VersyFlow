    <linearGradient id="flowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E91E8C"/>
      <stop offset="0.5" stop-color="#FF6BA4"/>
      <stop offset="1" stop-color="#FFB6C9"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#FFFFFF" opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  <rect width="600" height="600" fill="url(#glowRose)"/>
  <rect width="600" height="600" fill="url(#glowDeep)"/>
