    <text x="300" y="452" text-anchor="middle" font-size="56" font-weight="800" letter-spacing="-1" fill="url(#titleGrad)">VersyFlow</text>
    <text x="300" y="494" text-anchor="middle" font-size="15" fill="#F3C6DC" opacity="0.85">Mémorisation biblique — Science · Élégance · Foi</text>
