<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="VersyFlow">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B0812"/>
      <stop offset="0.55" stop-color="#120509"/>
      <stop offset="1" stop-color="#200A16"/>
    </linearGradient>
    <radialGradient id="glowRose" cx="0.8" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#E91E8C" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#E91E8C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowDeep" cx="0.15" cy="0.95" r="0.8">
      <stop offset="0" stop-color="#B0286F" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#B0286F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9EC4"/>
      <stop offset="0.5" stop-color="#E91E8C"/>
      <stop offset="1" stop-color="#8E1A5C"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
