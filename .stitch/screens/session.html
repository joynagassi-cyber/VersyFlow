<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VersyFlow — Session Mémorisation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fafafa; color: #2D2D2D; }
    .screen { max-width: 430px; margin: 0 auto; min-height: 100vh; background: #fafafa; }
    .header { padding: 16px 20px; background: #fff; display: flex; align-items: center; justify-content: space-between; }
    .close-btn { width: 40px; height: 40px; border-radius: 20px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; }
    .reference { text-align: center; }
    .reference h2 { font-size: 18px; font-weight: 700; }
    .reference span { font-size: 12px; color: #E91E8C; font-weight: 600; }
    .strategy-btn { width: 40px; height: 40px; border-radius: 20px; background: #f5f5f5; }
    .progress-bar { height: 4px; background: #eee; }
    .progress-fill { height: 100%; background: #E91E8C; width: 60%; }
    .passage-nav { padding: 12px 20px; background: #fff; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #eee; }
    .nav-btn { width: 36px; height: 36px; border-radius: 18px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; }
    .verse-dots { display: flex; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 4px; background: #ddd; }
    .dot.active { background: #E91E8C; width: 20px; }
    .dot.completed { background: #E91E8C; opacity: 0.5; }
    .word-area { padding: 24px 20px; min-height: 200px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .word-chip { padding: 12px 16px; border-radius: 12px; font-size: 18px; font-weight: 500; }
    .word-chip.revealed { background: #E91E8C; color: #fff; }
    .word-chip.hidden { background: #E0E0E0; color: #E0E0E0; }
    .controls { padding: 16px 20px; }
    .reveal-btn { width: 100%; padding: 16px; border-radius: 26px; background: #E91E8C; color: #fff; font-size: 16px; font-weight: 600; text-align: center; }
    .complete-btn { width: 100%; padding: 18px; border-radius: 26px; background: #4CAF50; color: #fff; font-size: 18px; font-weight: 700; text-align: center; margin-top: 12px; }
    .info { padding: 16px 20px; text-align: center; color: #999; font-size: 13px; }
  </style>
</head>
<body>
  <div class="screen">
    <div class="header">
      <div class="close-btn">✕</div>
      <div class="reference">
        <h2>Jean 3:16-18</h2>
        <span>Verset 2/3</span>
      </div>
      <div class="strategy-btn">☰</div>
    </div>
    
    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>
    
    <div class="passage-nav">
      <div class="nav-btn">◀</div>
      <div class="verse-dots">
        <div class="dot completed"></div>
        <div class="dot active"></div>
        <div class="dot"></div>
      </div>
      <div class="nav-btn">▶</div>
    </div>
    
    <div class="word-area">
      <span class="word-chip revealed">et</span>
      <span class="word-chip revealed">la</span>
      <span class="word-chip revealed">parole</span>
      <span class="word-chip revealed">était</span>
      <span class="word-chip revealed">auprès</span>
      <span class="word-chip hidden">•••</span>
      <span class="word-chip hidden">•••</span>
    </div>
    
    <div class="controls">
      <div class="reveal-btn">Mot suivant →</div>
      <div class="complete-btn">Terminer la session ✓</div>
    </div>
    
    <div class="info">
      FSRS calculera votre prochain rappel optimal
    </div>
  </div>
</body>
</html>
