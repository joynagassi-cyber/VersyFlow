<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VersyFlow — Confirmation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fafafa; color: #2D2D2D; }
    .screen { max-width: 430px; margin: 0 auto; min-height: 100vh; background: #fafafa; }
    .success { text-align: center; padding: 40px 20px; }
    .icon { width: 96px; height: 96px; border-radius: 48px; background: #E8F5E9; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
    .icon svg { width: 64px; height: 64px; color: #4CAF50; }
    .success h1 { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
    .success p { font-size: 18px; color: #999; }
    .passage-badge { display: inline-flex; align-items: center; gap: 6px; background: #E91E8C15; padding: 6px 12px; border-radius: 20px; margin-top: 10px; font-size: 13px; color: #E91E8C; font-weight: 600; }
    .card { margin: 20px; background: #fff; border-radius: 24px; padding: 24px; }
    .card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; }
    .card-header svg { width: 20px; height: 20px; color: #E91E8C; }
    .card-header h3 { font-size: 16px; font-weight: 700; }
    .metrics { display: flex; justify-content: space-around; margin-bottom: 16px; }
    .metric { text-align: center; flex: 1; }
    .metric .value { font-size: 28px; font-weight: 800; color: #E91E8C; }
    .metric .label { font-size: 12px; color: #999; margin-top: 4px; }
    .metric .unit { font-size: 11px; color: #bbb; margin-top: 2px; }
    .divider { width: 1px; background: #eee; }
    .rating { display: flex; align-items: center; justify-content: center; gap: 8px; padding-top: 16px; border-top: 1px solid #f5f5f5; }
    .dot { width: 10px; height: 10px; border-radius: 5px; background: #4CAF50; }
    .rating-label { font-size: 14px; font-weight: 600; color: #4CAF50; }
    .rating-repeat { font-size: 13px; color: #999; }
    .actions { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .btn { padding: 16px; border-radius: 26px; font-size: 16px; font-weight: 600; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-secondary { background: #fff; color: #E91E8C; border: 2px solid #E91E8C; }
    .btn-primary { background: #E91E8C; color: #fff; }
  </style>
</head>
<body>
  <div class="screen">
    <div class="success">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
      </div>
      <h1>Passage mémorisé ! ✨</h1>
      <p>Jean 3:16-18</p>
      <div class="passage-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M21 5c-1.11-.35-2.33-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.8-1.5 5.5-1.5 1.65 0 3.35.3 4.75 1.05.1.05.15.05.25.05.25 0 .5-.25.5-.5V6c-.6-.45-1.25-.75-2-1z"/></svg>
        Passage (3 versets)
      </div>
    </div>
    
    <div class="card">
      <div class="card-header">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14l-5-5 1.41-1.41L12 14.17l7.59-7.59L21 8l-9 9z"/></svg>
        <h3>Résultats FSRS</h3>
      </div>
      <div class="metrics">
        <div class="metric">
          <div class="value">4</div>
          <div class="label">Prochain rappel</div>
          <div class="unit">dans 4 jours</div>
        </div>
        <div class="divider"></div>
        <div class="metric">
          <div class="value">3.5</div>
          <div class="label">Stabilité</div>
          <div class="unit">jours</div>
        </div>
        <div class="divider"></div>
        <div class="metric">
          <div class="value">5.0</div>
          <div class="label">Difficulté</div>
          <div class="unit">score</div>
        </div>
      </div>
      <div class="rating">
        <div class="dot"></div>
        <span class="rating-label">Bon</span>
        <span class="rating-repeat">×3</span>
      </div>
    </div>
    
    <div class="actions">
      <div class="btn btn-secondary">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        Retour à l'accueil
      </div>
      <div class="btn btn-primary">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        Mémoriser un autre passage
      </div>
    </div>
  </div>
</body>
</html>
