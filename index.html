<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/app-icons/01-rose-origine.png" />
    <link rel="apple-touch-icon" href="/icons/app-icons/01-rose-origine.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#D81B97" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="VersyFlow" />
    <meta
      name="description"
      content="VersyFlow — Mémorisation de versets bibliques : Science • Élégance • Foi"
    />
    <title>VersyFlow — Mémorisation de versets bibliques</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
      }
      #root {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Splash statique : visible immédiatement, remplacé dès que React rend.
           Si le JS échoue, le message d'erreur s'affiche au lieu d'un écran blanc. -->
      <div
        id="boot-splash"
        style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fbf9f9;color:#d81b60;font-family:Georgia,serif;font-size:22px;font-weight:700"
      >
        VersyFlow…
      </div>
    </div>
    <script>
      window.addEventListener('error', function (e) {
        var el = document.getElementById('boot-splash');
        if (el) {
          el.style.color = '#ba1a1a';
          el.style.fontSize = '14px';
          el.style.padding = '24px';
          el.textContent =
            'Erreur de démarrage : ' + (e.message || 'script introuvable');
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
