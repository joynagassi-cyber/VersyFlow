name: CI/CD — Web + Android + iOS

#
# Single unified pipeline for VersyFlow (international app: Android + iOS).
#
# DAG:
#   quality-gate (matrix: typecheck / lint / tests, in parallel)
#     -> build-web (Vite tsc + vite build -> www/ artifact)
#        -> build-android        (debug APK, no secrets)   [PR / main / develop / dispatch]
#        -> build-android-release (signed APK, KEYSTORE)   [tag v* / dispatch build_release]
#        -> build-ios-release   (signed .ipa, APPLE_*)    [tag v*] gated on APPLE secrets
#        -> publish-release     (GitHub Release with APK + IPA assets) [tag v*]
#
# Release model:
#   A GitHub Release is created when a tag v* is pushed (e.g. v1.2.3).
#   The signed Android APK and (when configured) the signed iOS .ipa are
#   attached as release assets. The app version string comes from the tag.
#
# iOS notes:
#   - iOS requires a macOS runner (macos-latest = Xcode 15 / macOS 14).
#     These runners are BILLED (macOS minutes, ~10x linux rate) — each iOS
#     run costs money even when skipped-outside-tags. The job is GATED so it
#     only runs on tag v*, to avoid burning macOS minutes on every push.
#   - The ios/ project (Xcode) is generated locally on a Mac with
#     `npx cap add ios` and committed. It is NOT generated by the workflow.
#   - The job is skipped automatically until the APPLE_* secrets exist
#     (see .github/secrets-checklist.md). When you add them, it starts
#     producing the signed .ipa with no workflow change.
#
# Required secrets — see .github/secrets-checklist.md
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_POWERSYNC_URL   (build env)
#   KEYSTORE, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD           (APK signing)
#   APPLE_CERTIFICATE_P12, APPLE_CERTIFICATE_PASSWORD,
#   APPLE_PROVISION_PROFILE_BASE64, APPLE_TEAM_ID                  (.ipa signing)
#
# Android path per job:
#   npm ci (postinstall runs scripts/patch-powersync-worker.cjs, idempotent)
#   -> download-artifact web-build-www -> ./www
#   -> npx cap sync android (copies www into android/assets/www)
#   -> cd android && ./gradlew ...
#
# Vite env vars are workflow-level env from secrets. PRs run with empty values
# (safe placeholder config); release builds on tags get real values.
#

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build a SIGNED release APK + .ipa (requires APPLE_*/KEYSTORE secrets)'
        type: boolean
        default: false
      version:
        description: 'Version label appended to artifact names (optional)'
        type: string
        required: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Injected at Vite build time (import.meta.env). Empty values are safe:
  # the app degrades to placeholder config; PRs run without secrets.
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
  VITE_POWERSYNC_URL: ${{ secrets.VITE_POWERSYNC_URL }}

# A "release" context: pushing a v* tag, or dispatch with build_release=true.
# The release tag carries the version (v1.2.3 -> 1.2.3).
#
#   is-tag : github.ref_type == 'tag' && github.ref starts with 'refs/tags/'
#   rel-version : tag name without the leading 'v', or the dispatch input, or 'dev'

jobs:
  # ------------------------------------------------------------------
  # 0. Resolve release context (version string + is-release flag)
  # ------------------------------------------------------------------
  resolve:
    name: Resolve release context
    runs-on: ubuntu-latest
    outputs:
      is-release: ${{ steps.c.outputs.is-release }}
      version: ${{ steps.c.outputs.version }}
    steps:
      - id: c
        run: |
          # tag push -> version = tag without 'v'; dispatch -> input; else -> dev
          VER="${{ github.event.inputs.version }}"
          ISREL="false"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            T="${GITHUB_REF#refs/tags/}"
            VER="${T#v}"
            ISREL="true"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "$VER" = "" ] && VER="dev"
            [ "${{ github.event.inputs.build_release }}" = "true" ] && ISREL="true"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "is-release=$ISREL" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VER is-release=$ISREL"

  # ------------------------------------------------------------------
  # 1. Quality gates — typecheck + lint + tests run as a parallel matrix
  # ------------------------------------------------------------------
  quality-gate:
    name: Quality Gate — ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [typecheck, lint, tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (runs postinstall PowerSync worker patch)
        run: npm ci

      - name: TypeScript typecheck
        if: matrix.check == 'typecheck'
        run: npm run typecheck

      - name: ESLint
        if: matrix.check == 'lint'
        run: npm run lint

      - name: Vitest (with coverage)
        if: matrix.check == 'tests'
        run: npm run test:coverage

      - name: Upload coverage report
        if: matrix.check == 'tests'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          retention-days: 7
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # 2. Web build (Vite -> www/), shared by Android + iOS builds
  # ------------------------------------------------------------------
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: [quality-gate, resolve]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (runs postinstall PowerSync worker patch)
        run: npm ci

      - name: Vite production build (outputs to www/)
        run: npm run build

      - name: Upload www/ artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-www
          path: www
          retention-days: 7

  # ------------------------------------------------------------------
  # 3. Android — debug APK (PRs, main/develop pushes, manual dispatch)
  #    Debug builds need no keystore; signing uses android/app/debug.keystore.
  #    Skipped when the dispatch explicitly asks for the signed release build.
  # ------------------------------------------------------------------
  build-android:
    name: Android (debug APK)
    runs-on: ubuntu-latest
    needs: [quality-gate, build-web, resolve]
    if: (github.ref == 'refs/heads/develop' && github.event_name == 'push') || github.event_name == 'pull_request' || ((github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && !inputs.build_release) || (github.ref_type == 'tag'))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK (Build-Tools 35, Platform 35)
        uses: android-actions/setup-android@v3

      - name: Install dependencies (runs postinstall PowerSync worker patch)
        run: npm ci

      - name: Restore web build (www/)
        uses: actions/download-artifact@v4
        with:
          name: web-build-www
          path: www

      - name: Capacitor sync (copies www/ into android/assets/www)
        run: npx cap sync android

      - name: Gradle build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: versyflow-debug-${{ inputs.version || 'dev' }}-${{ github.sha }}.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # ------------------------------------------------------------------
  # 4. Android — SIGNED release APK
  #    Runs on tag v* push and on manual dispatch with build_release=true.
  #    The keystore (never committed) is decoded from the base64 KEYSTORE
  #    secret into keystore/release.keystore; RELEASE_* signing properties
  #    are appended to android/gradle.properties.
  #    Requires the four keystore secrets — see .github/secrets-checklist.md.
  # ------------------------------------------------------------------
  build-android-release:
    name: Android (signed release APK)
    runs-on: ubuntu-latest
    needs: [quality-gate, build-web, resolve]
    if: |
      (github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v'))
      || (github.event_name == 'workflow_dispatch' && inputs.build_release)
    environment: production
    permissions:
      contents: read
      actions: read
    outputs:
      apk-artifact: versyflow-release-${{ needs.resolve.outputs.version }}.apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK (Build-Tools 35, Platform 35)
        uses: android-actions/setup-android@v3

      - name: Install dependencies (runs postinstall PowerSync worker patch)
        run: npm ci

      - name: Restore web build (www/)
        uses: actions/download-artifact@v4
        with:
          name: web-build-www
          path: www

      - name: Restore release keystore from secret
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"     || { echo "::error::KEYSTORE secret (base64 keystore) is missing — see .github/secrets-checklist.md"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::KEYSTORE_PASSWORD secret is missing — see .github/secrets-checklist.md"; exit 1; }
          test -n "$KEY_ALIAS"        || { echo "::error::KEY_ALIAS secret is missing — see .github/secrets-checklist.md"; exit 1; }
          test -n "$KEY_PASSWORD"     || { echo "::error::KEY_PASSWORD secret is missing — see .github/secrets-checklist.md"; exit 1; }

          mkdir -p keystore
          echo "$KEYSTORE_B64" | base64 -d > keystore/release.keystore

          cat >> android/gradle.properties <<EOF

          # --- CI release signing (injected by GitHub Actions, never committed) ---
          RELEASE_STORE_FILE=../../keystore/release.keystore
          RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD
          RELEASE_KEY_ALIAS=$KEY_ALIAS
          RELEASE_KEY_PASSWORD=$KEY_PASSWORD
          EOF

      - name: Capacitor sync (copies www/ into android/assets/www)
        run: npx cap sync android

      - name: Gradle build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Verify APK signature (must NOT be the Android debug cert)
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::APK not found at $APK"; exit 1; }
          if keytool -printcert -jarfile "$APK" 2>/dev/null | grep -qi "Android Debug"; then
            echo "::error::APK is signed with the Android DEBUG keystore — release signing did not apply. Verify the KEYSTORE secrets are set."
            exit 1
          fi
          echo "Release APK signature OK (not the debug keystore)."

      - name: Upload release APK artifact
        id: up
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.resolve.outputs.version }}-android-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

  # ------------------------------------------------------------------
  # 5. iOS — SIGNED release .ipa
  #    Runs on tag v* push. GATED: skipped when APPLE_* secrets are absent,
  #    so the pipeline stays green until you configure Apple. When the
  #    secrets exist, this produces a signed .ipa that publish-release attaches.
  #
  #    macOS runners are BILLED (macOS minutes, ~10x linux). This job only
  #    runs on tags to avoid cost on every push. Requires the committed
  #    ios/ project (generated on a Mac with `npx cap add ios`) + CocoaPods.
  #
  #    Secrets (see .github/secrets-checklist.md):
  #      APPLE_CERTIFICATE_P12            (base64 distribution .p12)
  #      APPLE_CERTIFICATE_PASSWORD      (p12 password)
  #      APPLE_PROVISION_PROFILE_BASE64  (base64 .mobileprovision)
  #      APPLE_TEAM_ID                   (Apple Developer Team ID)
  # ------------------------------------------------------------------
  build-ios-release:
    name: iOS (signed .ipa)
    runs-on: macos-latest          # Xcode 15 / macOS 14 (billed macOS runner)
    needs: [quality-gate, build-web, resolve]
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    environment: production
    permissions:
      contents: read
    outputs:
      ipa-artifact: ${{ steps.check.outputs.ipa-artifact }}
    steps:
      - uses: actions/checkout@v4

      # Gate: only proceed if the Apple signing secrets are configured.
      - id: check
        run: |
          if [ -n "${{ secrets.APPLE_CERTIFICATE_P12 }}" ] && [ -n "${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}" ]; then
            echo "ipa-artifact=${{ needs.resolve.outputs.version }}-ios-release.ipa" >> "$GITHUB_OUTPUT"
          else
            echo "Apple signing secrets (APPLE_*) are not configured — skipping iOS build."
            echo "Configure them (see .github/secrets-checklist.md) to produce the signed .ipa."
            echo "IPA_ENABLED=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip iOS build (Apple secrets not set)
        if: steps.check.outputs.IPA_ENABLED == 'false'
        run: exit 0

      - uses: actions/setup-node@v4
        if: steps.check.outputs.IPA_ENABLED != 'false'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (runs postinstall PowerSync worker patch)
        if: steps.check.outputs.IPA_ENABLED != 'false'
        run: npm ci

      - name: Restore web build (www/)
        if: steps.check.outputs.IPA_ENABLED != 'false'
        uses: actions/download-artifact@v4
        with:
          name: web-build-www
          path: www

      - name: CocoaPods + Capacitor sync (ios)
        if: steps.check.outputs.IPA_ENABLED != 'false'
        working-directory: ios
        run: |
          set -e
          test -d "$PWD" || { echo "::error::ios/ project missing — generate it on a Mac with 'npx cap add ios' and commit it"; exit 1; }
          pod install
        env:
          # cap sync ios copies www/ into ios/App/App/www
          CI_WEB_DIR: ${{ github.workspace }}/www

      - name: Capacitor copy web into ios/App/App/www
        if: steps.check.outputs.IPA_ENABLED != 'false'
        run: |
          mkdir -p ios/App/App/www
          cp -r www/* ios/App/App/www/

      - name: Install Apple certificate + provisioning profile into keychain
        if: steps.check.outputs.IPA_ENABLED != 'false'
        env:
          P12_B64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROVISION_B64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "$P12_B64" || { echo "::error::APPLE_CERTIFICATE_P12 missing"; exit 1; }
          test -n "$PROVISION_B64" || { echo "::error::APPLE_PROVISION_PROFILE_BASE64 missing"; exit 1; }
          test -n "$TEAM_ID" || { echo "::error::APPLE_TEAM_ID missing"; exit 1; }
          # keychain for the build
          KEYCHAIN=${RUNNER_TEMP}/build.keychain-db
          security create-keychain -p "build-keychain-pw" "$KEYCHAIN"
          security default-keychain -d user -set "$KEYCHAIN"
          security unlock-keychain -p "build-keychain-pw" "$KEYCHAIN"
          security set-keychain-settings -u -t 3600 "$KEYCHAIN"
          security import <(echo "$P12_B64" | base64 -d) \
            -P "$P12_PASSWORD" -A -t cert -f pkcs12 "$KEYCHAIN"
          # trust the distribution cert
          CERT_ID=$(security find-certificate -c "Apple Distribution" -Z "$KEYCHAIN" | head -n1 | awk '{print $2}')
          security set-key-settings -setSettings true -c "$CERT_ID" "$KEYCHAIN"
          security set-card -s "$CERT_ID" "$KEYCHAIN"
          security set-keychain-settings -u -t 3600 "$KEYCHAIN"
          # provisioning profile
          echo "$PROVISION_B64" | base64 -d > /tmp/versyflow.mobileprovision
          uuid=$(plutil -extract UUID raw -o - /tmp/versyflow.mobileprovision | tr -d '\n')
          mkdir -p ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles
          cp /tmp/versyflow.mobileprovision "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$uuid.mobileprovision"

      - name: Xcode archive (VersyFlow release)
        if: steps.check.outputs.IPA_ENABLED != 'false'
        run: |
          set -e
          cd ios/App
          # scheme = App (Capacitor default workspace/scheme)
          xcodebuild -project App.xcodeproj -scheme App \
            -configuration Release \
            -archivePath build/VersyFlow.xcarchive \
            archive 2>&1 | tail -n 50

      - name: Xcode export signed .ipa
        if: steps.check.outputs.IPA_ENABLED != 'false'
        run: |
          set -e
          cat > build/ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
          </dict>
          </plist>
          EOF
          cd ios/App
          xcodebuild -exportArchive \
            -archivePath build/VersyFlow.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export
          # the .ipa is in build/export (App Store export)
          find build/export -name "*.ipa" -exec cp {} "../../versyflow-release.ipa" \;
          echo "ipa exported:"; ls -la ../../versyflow-release.ipa

      - name: Upload .ipa artifact
        if: steps.check.outputs.IPA_ENABLED != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.resolve.outputs.version }}-ios-release.ipa
          path: versyflow-release.ipa
          retention-days: 30

  # ------------------------------------------------------------------
  # 6. Publish the GitHub Release (tag v*): attach the signed APK (+ .ipa)
  #    Uses softprops/action-gh-release. Creates or updates the release for
  #    the tag and uploads the release binaries as assets.
  # ------------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [resolve, build-android-release, build-ios-release]
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Download the signed APK artifact
        if: needs.build-android-release.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.resolve.outputs.version }}-android-release.apk
          path: release-assets
        continue-on-error: true

      - name: Download the signed .ipa artifact
        if: needs.build-ios-release.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.resolve.outputs.version }}-ios-release.ipa
          path: release-assets
        continue-on-error: true

      - name: Create / update the GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: VersyFlow ${{ needs.resolve.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*.apk
            release-assets/*.ipa
          # If both platforms built, both assets are attached; if only one
          # built, only that asset is attached (empty patterns are ignored).
