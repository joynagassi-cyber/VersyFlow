name: Build VersyFlow APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version de l\'application (ex: 1.0.0)'
        required: false
      build_type:
        description: 'Type de build (debug/release)'
        required: true
        default: 'release'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm install  # Utilise install pour éviter les problèmes de synchronisation du lock file

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Android SDK
      uses: android-actions/setup-sdks@v2
      with:
        cmdline-tools-version: latest
        platforms: android-34
        build-tools: 35.0.0
        ndk: '26.1.10909125'

    - name: Accept licenses
      run: yes | sdkmanager --licenses

    - name: Configure signing (production)
      if: inputs.build_type == 'release'
      run: |
        mkdir -p android/app
        cat > android/gradle.properties << EOF
        RELEASE_STORE_FILE=../keystore/release.keystore
        RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
        RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}
        RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
        EOF

    - name: Configure signing (debug)
      if: inputs.build_type == 'debug'
      run: |
        mkdir -p android/app
        echo "android.buildTypes.debug.signingConfig = signingConfigs.debug" >> android/app/build.gradle

    - name: Build APK
      run: |
        cd android
        if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
          ./gradlew assembleRelease
        else
          ./gradlew assembleDebug
        fi
        cd ..

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: versyflow-${{ github.event.inputs.build_type }}
        path: android/app/build/outputs/apk/**/*.apk
        retention-days: 30
