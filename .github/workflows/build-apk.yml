name: Build VersyFlow APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Android SDK
      uses: android-actions/setup-sdks@v2
      with:
        cmdline-tools-version: latest
        platforms: android-34
        build-tools: 35.0.0
        ndk: '26.1.10909125'

    - name: Accept licenses
      run: yes | sdkmanager --licenses

    - name: Configure signing
      run: |
        echo "RELEASE_STORE_FILE=../keystore/release.keystore" > android/gradle.properties
        echo "RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> android/gradle.properties
        echo "RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> android/gradle.properties
        echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> android/gradle.properties

    - name: Build Release APK
      run: |
        cd android
        ./gradlew assembleRelease
        cd ..

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: versyflow-apk
        path: android/app/build/outputs/apk/release/app-release.apk
