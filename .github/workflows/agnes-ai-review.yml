name: Agnes AI Code Review

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, edited, synchronize]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      instructions:
        description: 'Instructions pour Agnes AI'
        required: true
        default: 'Review the code and suggest improvements'
      pr_number:
        description: 'PR Number (optional, required for PR review)'
        required: false
      comment_id:
        description: 'Comment ID (optional, for comment-based runs)'
        required: false

jobs:
  agnes-ai:
    name: Agnes AI Code Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install OpenAI SDK
        run: npm install openai

      - name: Run Agnes AI Review
        id: agnes
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AGNES_BASE_URL: 'https://apihub.agnes-ai.com/v1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_INSTRUCTIONS: ${{ github.event.inputs.instructions || 'Review the code and suggest improvements in French' }}
          INPUT_PR_NUMBER: ${{ github.event.inputs.pr_number || '' }}
        run: |
          # Create a Node.js script to call Agnes AI
          cat > review.js << 'SCRIPT'
          const OpenAI = require('openai');
          const fs = require('fs');
          const { execSync } = require('child_process');

          const client = new OpenAI({
            apiKey: process.env.AGNES_API_KEY,
            baseURL: process.env.AGNES_BASE_URL
          });

          async function getPRContext() {
            const prNumber = process.env.INPUT_PR_NUMBER || process.env.GITHUB_PR_NUMBER || '';
            const repo = process.env.GITHUB_REPOSITORY;

            if (!prNumber) return null;

            try {
              const prData = execSync(`gh pr view ${prNumber} --repo ${repo} --json title,body,headRefName,baseRefName`).toString();
              const pr = JSON.parse(prData);
              const diff = execSync(`gh pr diff ${prNumber} --repo ${repo}`).toString();
              return {
                title: pr.title,
                body: pr.body,
                branch: pr.headRefName,
                base: pr.baseRefName,
                diff: diff.substring(0, 10000) // Limit diff size
              };
            } catch (e) {
              console.error('Error fetching PR:', e.message);
              return null;
            }
          }

          async function getIssueContext() {
            const issueNumber = process.env.GITHUB_ISSUE_NUMBER || '';
            const repo = process.env.GITHUB_REPOSITORY;

            if (!issueNumber) return null;

            try {
              const issueData = execSync(`gh issue view ${issueNumber} --repo ${repo} --json title,body`).toString();
              const issue = JSON.parse(issueData);
              return {
                title: issue.title,
                body: issue.body
              };
            } catch (e) {
              console.error('Error fetching issue:', e.message);
              return null;
            }
          }

          async function main() {
            const prContext = await getPRContext();
            const issueContext = await getIssueContext();
            const instructions = process.env.INPUT_INSTRUCTIONS;

            let prompt = '';

            if (prContext) {
              prompt = `Review this Pull Request and provide feedback in French:\n\n` +
                       `Title: ${prContext.title}\n` +
                       `Branch: ${prContext.branch} → ${prContext.base}\n\n` +
                       `Description:\n${prContext.body}\n\n` +
                       `Code Changes (diff):\n${prContext.diff}\n\n` +
                       `Instructions: ${instructions}`;
            } else if (issueContext) {
              prompt = `Review this Issue and provide suggestions in French:\n\n` +
                       `Title: ${issueContext.title}\n` +
                       `Description:\n${issueContext.body}\n\n` +
                       `Instructions: ${instructions}`;
            } else {
              prompt = instructions;
            }

            const response = await client.chat.completions.create({
              model: 'agnes-2.0-flash',
              messages: [
                {
                  role: 'system',
                  content: 'You are a helpful code review assistant. Provide constructive, detailed feedback in French. Focus on code quality, security, performance, and best practices.'
                },
                {
                  role: 'user',
                  content: prompt
                }
              ],
              max_tokens: 2000,
              temperature: 0.7
            });

            const review = response.choices[0].message.content;
            console.log('Review generated:', review);
            fs.writeFileSync('review-output.txt', review);
          }

          main().catch(console.error);
          SCRIPT

          # Run the review
          node review.js

          # Read the output
          if [ -f review-output.txt ]; then
            cat review-output.txt
          else
            echo "Error: Review output not generated"
            exit 1
          fi

      - name: Post Comment on Issue
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('review-output.txt', 'utf8');
            const commentBody = `## Agnes AI Review\n\n${output}`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });

      - name: Post Comment on PR Review
        if: github.event_name == 'pull_request_review_comment'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('review-output.txt', 'utf8');
            const commentBody = `## Agnes AI Review\n\n${output}`;

            await github.rest.pulls.createReviewComment({
              pull_request_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });

      - name: Add PR Review
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('review-output.txt', 'utf8');
            const reviewBody = `## Agnes AI Review\n\n${output}`;

            await github.rest.pulls.createReview({
              pull_request_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: reviewBody,
              event: 'COMMENT'
            });

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agnes-ai-review
          path: review-output.txt
          retention-days: 7
